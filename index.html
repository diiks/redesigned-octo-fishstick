<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html {
  width: 100%;
  min-height: 100%;
  background: #C42B34;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  color-scheme: dark;
  height: 100%;
  overflow: hidden;
}

body, button, input {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-family: 'Orbitron', 'Press Start 2P', sans-serif;
}

button, input {
  -webkit-appearance: none;
  appearance: none;
}

body {
  background: linear-gradient(180deg, #C42B34 0%, #a0242c 30%, #7a1c22 60%, #4a0f14 100%);
  font-family: 'Orbitron', 'Press Start 2P', sans-serif;

  height: 100dvh;

.app {

  margin: 0 auto;
}

.content-layer {
  position: relative; z-index: 2; width: 100%;
  height: 100%;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
}

/* --- шапка с неоновой вывеской --- */
.hero-header {
  width: 100%;
  padding: 3.5rem 1rem 0.7rem;
  background: #4a001a;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  position: relative;
  z-index: 2;
  border-bottom: 3px solid #FC8A2D;
  flex-shrink: 0;
}

.hero-header::before {
  content: '🕹️ DIX COUNTER 🕹️';
  position: absolute;
  top: 0.8rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  color: #FCE9AB;
  font-family: 'Press Start 2P', monospace;
  white-space: nowrap;
  opacity: 0.9;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: neonGlow 2s infinite alternate ease-in-out;
}

@keyframes neonGlow {
  0% { text-shadow: 0 0 5px #FC8A2D, 0 0 10px #DC4F7C, 0 0 20px #C42B34; opacity: 0.7; }
  100% { text-shadow: 0 0 10px #FC8A2D, 0 0 25px #DC4F7C, 0 0 40px #DC4F7C, 0 0 60px #FCE9AB; opacity: 1; }
}

@media (max-width: 480px) {
  .hero-header::before { font-size: 0.7rem; top: 0.9rem; gap: 5px; }
  .hero-header { padding: 3rem 0.5rem 0.6rem; }
  body { padding: 0; }
  .app { border-radius: 0; border-left: 2px solid #FC8A2D; border-right: 2px solid #FC8A2D; }
}

.hero-header .date-navigation,
.hero-header .date-actions {
  position: relative; z-index: 1;
}

/* Попап статистики */
.stats-popup {
  position: absolute;
  top: 60px;
  right: 15px;
  background: rgba(74, 0, 26, 0.95);
  border: 2px solid #FC8A2D;
  border-radius: 16px;
  padding: 12px 16px;
  z-index: 100;
  display: none;
  flex-direction: column;
  gap: 10px;
  font-size: 0.75rem;
  color: #FCE9AB;
  white-space: nowrap;
  box-shadow: 0 0 20px rgba(252, 138, 45, 0.4), 0 0 40px rgba(220, 79, 124, 0.3);
  backdrop-filter: blur(5px);
}

.stats-popup.show {
  display: flex;
}

.stats-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 5px 0;
}

.stats-label {
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: #FC8A2D;
  font-weight: 600;
  text-transform: uppercase;
}

.stats-value {
  color: #FCE9AB;
  font-weight: 700;
  font-size: 1rem;
  text-shadow: 0 0 8px #FCE9AB;
}

.date-navigation {
  margin-top: 0.5rem;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;

}

.arrow-btn {

  background: linear-gradient(180deg, #DC4F7C 0%, #C42B34 100%);
  border: 2px solid #FC8A2D;
  box-shadow: inset 0 2px 0 rgba(252, 233, 171, 0.4), 0 4px 10px rgba(0,0,0,0.6), 0 0 12px rgba(252, 138, 45, 0.3);
  font-size: 1rem; font-weight: bold; color: #FCE9AB; cursor: pointer;

}
.arrow-btn:hover {

.date-actions {

}

.search-btn, .today-btn {
  padding: 0.6rem 1.2rem; border-radius: 20px;
  background: linear-gradient(180deg, #DC4F7C 0%, #C42B34 100%);
  border: 2px solid #FC8A2D;
  box-shadow: inset 0 2px 0 rgba(252, 233, 171, 0.4), 0 3px 8px rgba(0,0,0,0.6);
  font-weight: 400; color: #FCE9AB; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease; white-space: nowrap;
  font-size: 0.7rem; font-family: 'Press Start 2P', monospace;

}
.search-btn:hover, .today-btn:hover {
  background: linear-gradient(180deg, #e6638a 0%, #d43b4a 100%);

.search-btn:active, .today-btn:active { transform: scale(0.93); }

.today-btn:hover { background: linear-gradient(180deg, #fda04d 0%, #d97d24 100%); box-shadow: inset 0 2px 0 rgba(252, 233, 171, 0.5), 0 3px 12px rgba(0,0,0,0.6), 0 0 18px rgba(252, 233, 171, 0.5); }

/* --- блок сумм с кнопкой статистики --- */
.sums-container { 
  width: 100%; display: flex; gap: 0.5rem; 
  padding: 0.6rem 0.8rem;
  background: rgba(74, 15, 20, 0.4);

  align-items: center;
  position: relative;
}
.sum-block {
  flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column;
  align-items: center; gap: 0.3rem; background: rgba(220, 79, 124, 0.25);
  padding: 0.5rem 0.6rem; border: 2px solid #FC8A2D;

}
.sum-label {
  font-weight: 400; color: #FCE9AB; font-size: 0.42rem;

}
.sum-input {
  width: 100%; padding: 0.4rem 0.4rem; border: 2px solid #FC8A2D;

  outline: none; color: #FCE9AB; font-family: 'Press Start 2P', monospace;

}
.sum-input:focus { border-color: #DC4F7C; box-shadow: 0 0 10px rgba(220, 79, 124, 0.5), inset 0 0 8px rgba(252, 233, 171, 0.2); }
.sum-input[readonly] { background: rgba(74, 15, 20, 0.9); cursor: default; color: #DC4F7C; }

.stats-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(220, 79, 124, 0.3);
  border: 2px solid #FC8A2D;
  color: #FCE9AB;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease;
  flex-shrink: 0;
}

.stats-btn:hover {
  background: rgba(220, 79, 124, 0.5);
  transform: scale(1.1);
}

.stats-btn:active { transform: scale(0.9); }

/* --- таблица с плавной прокруткой --- */
.table-container {
  width: 100%; 
  flex: 1;
  overflow-y: auto;
  background: rgba(74, 15, 20, 0.6); 
  border-top: 2px solid #FC8A2D;
  padding: 0.3rem;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
  position: relative;
  z-index: 1;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table tr {
  border-bottom: 1px solid rgba(252, 138, 45, 0.15);
  animation: rowIn 0.35s ease both;
}
@keyframes rowIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.data-table tr:last-child { border-bottom: none; }
.data-table td { padding: 0.15rem 0.1rem; vertical-align: middle; height: 40px; }
.data-table td.row-number { padding-right: 0.05rem; width: 30px; font-size: 0.7rem; }
.data-table td.text-cell { padding-left: 0.1rem; padding-right: 0.2rem; width: 72%; }
.data-table td.number-cell { padding-left: 0.1rem; width: 22%; }

.row-number {
  font-weight: 400; color: #FC8A2D;
  text-align: center; font-family: 'Press Start 2P', monospace;
  text-shadow: 0 0 6px #FC8A2D;
}

.text-cell-input {
  width: 100%; height: 40px; padding: 0.4rem 0.5rem;
  border: 1px solid #FC8A2D;
  background: rgba(74, 15, 20, 0.85);
  outline: none;
  color: #FCE9AB;
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem; font-weight: 600;
  text-align: left;
  box-shadow: inset 0 0 6px rgba(252, 233, 171, 0.2);
  border-radius: 4px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-sizing: border-box;
}
.text-cell-input:focus {
  border-color: #DC4F7C;
  box-shadow: 0 0 8px rgba(220, 79, 124, 0.4), inset 0 0 6px rgba(252, 233, 171, 0.2);
}

.number-cell-input {
  width: 100%; height: 40px; padding: 0.4rem 0.5rem;
  border: 1px solid #FC8A2D;
  background: rgba(74, 15, 20, 0.85);
  outline: none;
  color: #DC4F7C;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2rem; font-weight: 700;
  text-align: center;
  box-shadow: inset 0 0 6px rgba(252, 233, 171, 0.2);
  border-radius: 4px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-sizing: border-box;
}
.number-cell-input:focus {
  border-color: #FCE9AB;
  box-shadow: 0 0 8px rgba(252, 233, 171, 0.4), inset 0 0 6px rgba(252, 233, 171, 0.2);
}

.table-container::-webkit-scrollbar { width: 10px; }
.table-container::-webkit-scrollbar-track { background: rgba(74, 15, 20, 0.8); border: 2px solid #DC4F7C; }
.table-container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #DC4F7C, #C42B34); border: 2px solid #FC8A2D; border-radius: 4px; }

/* плавная смена дня */
.table-container.fade-swap, .sums-container.fade-swap { animation: fadeSwap 0.35s ease; }
@keyframes fadeSwap { 0% { opacity: 0.2; transform: translateX(6px); } 100% { opacity: 1; transform: translateX(0); } }

/* --- индикатор синхронизации --- */
.sync-indicator {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #FC8A2D;
  color: #FCE9AB;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.8rem;
  opacity: 0;
  transition: opacity 0.15s ease-out;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Orbitron', sans-serif;
}

.sync-indicator.show { opacity: 1; }
.sync-indicator.error { background: #DC4F7C; }

.sync-indicator .sync-spinner {
  display: none;
  width: 12px;
  height: 12px;
  border: 2px solid rgba(252, 233, 171, 0.3);
  border-top: 2px solid #FCE9AB;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.sync-indicator.syncing .sync-spinner { display: inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }

.sync-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(252, 233, 171, 0.15);
  border: 2px solid #FC8A2D;
  color: #FCE9AB;
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: transform 0.15s ease;
}

.sync-btn:active { transform: scale(0.9); }
.sync-btn.syncing { animation: syncSpin 0.8s linear infinite; }

@keyframes syncSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.last-sync-time {
  font-size: 0.6rem;
  color: rgba(252, 233, 171, 0.5);
  text-align: center;
  padding: 4px 8px;
  font-family: 'Orbitron', sans-serif;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div class="sync-indicator" id="syncStatus">
    <span class="sync-spinner"></span>
    <span id="syncMessage">☁️ Готово</span>
</div>

<button class="sync-btn" id="syncBtn" title="Синхронизировать">💾</button>

<div class="app">
  <div class="content-layer">

    <div class="hero-header">
      <div class="stats-popup" id="statsPopup">
        <div class="stats-item">
          <span class="stats-label">СЕГОДНЯ</span>
          <span class="stats-value" id="statToday">0</span>
        </div>
        <div class="stats-item">
          <span class="stats-label">МЕС</span>
          <span class="stats-value" id="statMonth">0</span>
        </div>
      </div>

      <div class="date-navigation">
        <button class="arrow-btn sfx-btn" id="prevDayBtn">◄</button>
        <input type="text" id="currentDateInput" class="date-window-input" placeholder="09.08.26">
        <button class="arrow-btn sfx-btn" id="nextDayBtn">►</button>
      </div>

      <div class="date-actions">
        <button class="search-btn sfx-btn" id="searchDateBtn">ПОИСК</button>
        <button class="today-btn sfx-btn" id="todayBtn">СЕГОДНЯ</button>
      </div>
    </div>

    <div class="sums-container" id="sumsContainer">
      <div class="sum-block">
        <div class="sum-label">💰 ОБЩАЯ СУММА</div>
        <input type="text" id="totalSumInput" class="sum-input" placeholder="0">
      </div>
      <button class="stats-btn" id="statsBtn" title="Статистика">📊</button>
    </div>

    <div class="table-container" id="tableContainer">
      <table class="data-table"><tbody id="tableBody"></tbody></table>
    </div>

    <div class="last-sync-time" id="syncTimeDisplay">Последняя синхронизация: никогда</div>

  </div>
</div>

<script>
// API ключи JSONBin
const JSONBIN_BIN_ID = '6a86d952da38895dfefb0200';
const JSONBIN_API_KEY = '$2a$10$bgx/41LALlo4aQIF8oVtjuKDHyJpQ4oMlPTT52KWT1rsBhaZv5I4K';

let currentDateStr = '';
let allData = {};
let localChanges = false;
let isSyncing = false;
let dataVersion = 0;
let lastSyncTime = null;
let cloudSaveTimer = null;
let audioContext = null;
let statsVisible = false;

const STORAGE_KEY = 'dix_vegas_data';
const GLOBAL_TOTAL_KEY = 'dix_vegas_global_total';
const TOTAL_ROWS = 50;

function getAudioContext() {
  if (!audioContext) {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      console.warn('Web Audio API не поддерживается');
      return null;
    }
  }
  return audioContext;
}

function playClickSound() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1200, ctx.currentTime + 0.02);
    osc2.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.08);
    gain2.gain.setValueAtTime(0.1, ctx.currentTime + 0.02);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc2.start(ctx.currentTime + 0.02);
    osc2.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

function playSyncSound() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(600, now);
    osc1.frequency.setValueAtTime(900, now + 0.04);
    osc1.frequency.setValueAtTime(1200, now + 0.08);
    gain1.gain.setValueAtTime(0.3, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc1.start(now);
    osc1.stop(now + 0.12);
  } catch(e) {}
}

function showSync(message, isError = false, isSyncingState = false) {
  const el = document.getElementById('syncStatus');
  const msgEl = document.getElementById('syncMessage');
  if (!el || !msgEl) return;
  msgEl.textContent = message;
  el.className = 'sync-indicator';
  if (isError) el.classList.add('error');
  if (isSyncingState) el.classList.add('syncing');
  el.classList.add('show');
  if (!isSyncingState) {
    setTimeout(() => {
      el.classList.remove('show');
      el.classList.remove('syncing');
    }, 2000);
  }
}

function updateLastSyncTime() {
  lastSyncTime = new Date();
  const timeStr = lastSyncTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const el = document.getElementById('syncTimeDisplay');
  if (el) el.textContent = `Последняя синхронизация: ${timeStr}`;
  localStorage.setItem('dix_vegas_last_sync', lastSyncTime.toISOString());
}

async function loadFromCloud() {
  try {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();
    const cloudData = result.record || {};
    const cloudVersion = cloudData._version || 0;
    const localVersion = parseInt(localStorage.getItem('dix_vegas_data_version') || '0');
    if (cloudVersion >= localVersion) {
      allData = cloudData;
      dataVersion = cloudVersion;
      localStorage.setItem('dix_vegas_data_version', cloudVersion.toString());
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    updateLastSyncTime();
    return allData;
  } catch (e) {
    console.warn('Ошибка загрузки из облака:', e.message);
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) {
      try { allData = JSON.parse(local); } catch(parseError) {}
    }
    return allData;
  }
}

async function saveToCloud() {
  if (!localChanges) return true;
  try {
    dataVersion++;
    allData._version = dataVersion;
    const dataToSave = JSON.parse(JSON.stringify(allData));
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(dataToSave)
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    localStorage.setItem('dix_vegas_data_version', dataVersion.toString());
    localChanges = false;
    updateLastSyncTime();
    showSync('☁️ Синхронизировано');
    return true;
  } catch (e) {
    console.error('Ошибка сохранения:', e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    showSync('📱 Офлайн — сохранено локально', true);
    throw e;
  }
}

function scheduleCloudSave() {
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    if (!localChanges || isSyncing) return;
    try { await saveToCloud(); } catch (e) {}
  }, 1500);
}

function formatDateToDisplay(d) {
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getFullYear()).slice(-2);
}

function formatDateToStorage(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDateFromInput(s) {
  s = s.trim();
  if (!s) return null;
  if (s.indexOf('.') !== -1) {
    const p = s.split('.');
    if (p.length === 3) {
      const d = parseInt(p[0]), m = parseInt(p[1]), y = parseInt(p[2]);
      if (!isNaN(d) && !isNaN(m) && !isNaN(y) && m >= 1 && m <= 12) {
        const year = y < 100 ? y + 2000 : y;
        const dt = new Date(year, m-1, d);
        if (dt.getFullYear() === year && dt.getMonth() === m-1 && dt.getDate() === d) return formatDateToStorage(dt);
      }
    }
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const ip = s.split('-').map(Number);
    const d2 = new Date(ip[0], ip[1]-1, ip[2]);
    if (d2.getFullYear() === ip[0] && d2.getMonth() === ip[1]-1 && d2.getDate() === ip[2]) return s;
  }
  return null;
}

function getTodayString() { return formatDateToStorage(new Date()); }
function storageToDisplay(s) { const p = s.split('-').map(Number); return formatDateToDisplay(new Date(p[0], p[1]-1, p[2])); }
function formatNumber(v) { const n = parseFloat(v); if (isNaN(n)) return '0'; return n === Math.floor(n) ? n.toString() : n.toFixed(2); }

function getGlobalTotal() {
  const val = localStorage.getItem(GLOBAL_TOTAL_KEY);
  return val ? parseFloat(val) : 0;
}

function setGlobalTotal(val) {
  localStorage.setItem(GLOBAL_TOTAL_KEY, val.toString());
}

function getDayData(d) {
  if (!allData[d]) allData[d] = createEmptyDayData();
  return allData[d];
}

function createEmptyDayData() {
  const r = [];
  for (let i = 0; i < TOTAL_ROWS; i++) r.push({text:'', number:''});
  return {rows: r};
}

function getSpentSumForDate(dateStr) {
  if (!allData[dateStr]) return 0;
  const rows = allData[dateStr].rows || [];
  let sum = 0;
  for (let i = 0; i < TOTAL_ROWS; i++) {
    const val = rows[i] ? rows[i].number : '';
    if (val !== '' && val !== null && val !== undefined) {
      const n = parseFloat(val);
      if (!isNaN(n)) sum += n;
    }
  }
  return sum;
}

function getMonthlySpent(dateStr) {
  const parts = dateStr.split('-');
  const prefix = parts[0] + '-' + parts[1] + '-';
  let total = 0;
  for (const key in allData) {
    if (key.startsWith('_')) continue;
    if (key.indexOf(prefix) === 0) total += getSpentSumForDate(key);
  }
  return total;
}

function saveDataLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
  localChanges = true;
}

const dateInput = document.getElementById('currentDateInput');
const prevBtn = document.getElementById('prevDayBtn');
const nextBtn = document.getElementById('nextDayBtn');
const searchBtn = document.getElementById('searchDateBtn');
const todayBtn = document.getElementById('todayBtn');
const ti = document.getElementById('totalSumInput');
const tbody = document.getElementById('tableBody');
const tableContainer = document.getElementById('tableContainer');
const sumsContainer = document.getElementById('sumsContainer');
const syncBtn = document.getElementById('syncBtn');
const statsBtn = document.getElementById('statsBtn');
const statsPopup = document.getElementById('statsPopup');

function applyDateFromInput() {
  const val = dateInput.value.trim();
  if (val === '') { changeDate(getTodayString()); return; }
  const parsed = parseDateFromInput(val);
  if (parsed) { changeDate(parsed); }
  else { alert('ВВЕДИТЕ ДАТУ 09.08.26'); dateInput.value = storageToDisplay(currentDateStr); }
}

function updateStats() {
  if (!currentDateStr) return;
  const todaySpent = getSpentSumForDate(currentDateStr);
  const monthSpent = getMonthlySpent(currentDateStr);
  
  document.getElementById('statToday').textContent = formatNumber(todaySpent);
  document.getElementById('statMonth').textContent = formatNumber(monthSpent);
}

function toggleStats() {
  statsVisible = !statsVisible;
  if (statsVisible) {
    statsPopup.classList.add('show');
    updateStats();
  } else {
    statsPopup.classList.remove('show');
  }
}

function renderCurrentDay() {
  if (!currentDateStr) return;
  const d = getDayData(currentDateStr);
  dateInput.value = storageToDisplay(currentDateStr);
  
  const globalTotal = getGlobalTotal();
  ti.value = globalTotal > 0 ? formatNumber(globalTotal) : '';
  
  tbody.innerHTML = '';
  
  for (let i = 0; i < TOTAL_ROWS; i++) {
    const rd = d.rows[i] || {text:'', number:''};
    const tr = document.createElement('tr');
    tr.style.animationDelay = (i * 0.01) + 's';
    
    const tn = document.createElement('td');
    tn.className = 'row-number';
    tn.textContent = (i + 1) + '.';
    tr.appendChild(tn);
    
    const tt = document.createElement('td');
    tt.className = 'text-cell';
    const it = document.createElement('input');
    it.type = 'text';
    it.className = 'text-cell-input';
    it.placeholder = 'ОПИСАНИЕ';
    it.value = rd.text;
    it.addEventListener('input', (function(idx) { return function(e) {
      updateRowText(idx, e.target.value);
    }; })(i));
    tt.appendChild(it);
    tr.appendChild(tt);
    
    const tnum = document.createElement('td');
    tnum.className = 'number-cell';
    const inum = document.createElement('input');
    inum.type = 'text';
    inum.className = 'number-cell-input';
    inum.placeholder = '0';
    inum.value = rd.number;
    inum.addEventListener('input', (function(idx) { return function(e) {
      handleNumberInput(idx, e.target);
    }; })(i));
    inum.addEventListener('blur', function(e) { formatNumberField(e.target); });
    tnum.appendChild(inum);
    tr.appendChild(tnum);
    
    tbody.appendChild(tr);
  }
  
  if (statsVisible) updateStats();
}

function updateRowText(i, v) {
  if (!currentDateStr) return;
  getDayData(currentDateStr).rows[i].text = v;
  saveDataLocal();
  scheduleCloudSave();
}

function handleNumberInput(i, el) {
  if (!currentDateStr) return;
  let v = el.value;
  if (v === '') { updateNumberInRow(i, ''); return; }
  v = v.replace(',', '.');
  if (!/^-?\d*\.?\d*$/.test(v)) { el.value = v.slice(0, -1); return; }
  if (v.indexOf('.') !== -1) {
    const p = v.split('.');
    if (p[1] && p[1].length > 2) { p[1] = p[1].slice(0, 2); v = p.join('.'); el.value = v; }
  }
  updateNumberInRow(i, v);
}

function formatNumberField(el) {
  const v = el.value;
  if (v === '') return;
  const n = parseFloat(v.replace(',', '.'));
  el.value = !isNaN(n) ? formatNumber(v) : '';
  const tr = el.closest('tr');
  if (tr) {
    const i = Array.from(tr.parentNode.children).indexOf(tr);
    if (i >= 0 && i < TOTAL_ROWS) updateNumberInRow(i, el.value);
  }
}

function updateNumberInRow(i, v) {
  if (!currentDateStr) return;
  getDayData(currentDateStr).rows[i].number = v;
  saveDataLocal();
  if (statsVisible) updateStats();
  scheduleCloudSave();
}

function getSpentSum() { return getSpentSumForDate(currentDateStr); }

function playSwapAnim() {
  tableContainer.classList.remove('fade-swap');
  sumsContainer.classList.remove('fade-swap');
  void tableContainer.offsetWidth;
  tableContainer.classList.add('fade-swap');
  sumsContainer.classList.add('fade-swap');
}

function changeDate(ns) {
  if (!ns || !/^\d{4}-\d{2}-\d{2}$/.test(ns)) return;
  currentDateStr = ns;
  renderCurrentDay();
  if (statsVisible) updateStats();
  playSwapAnim();
}

function shiftDate(days) {
  if (!currentDateStr) return;
  const p = currentDateStr.split('-').map(Number);
  const date = new Date(p[0], p[1] - 1, p[2]);
  date.setDate(date.getDate() + days);
  changeDate(formatDateToStorage(date));
}

async function syncNow() {
  if (isSyncing) return;
  isSyncing = true;
  syncBtn.classList.add('syncing');
  playSyncSound();
  showSync('🔄 Синхронизация...', false, true);
  
  try {
    if (localChanges) {
      await saveToCloud();
    }
    
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const result = await response.json();
    const cloudData = result.record || {};
    const cloudVersion = cloudData._version || 0;
    
    if (cloudVersion >= dataVersion) {
      allData = cloudData;
      dataVersion = cloudVersion;
      localStorage.setItem('dix_vegas_data_version', dataVersion.toString());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      localChanges = false;
      renderCurrentDay();
      showSync('☁️ Данные обновлены');
    } else {
      await saveToCloud();
      showSync('☁️ Локальные данные сохранены');
    }
    
    updateLastSyncTime();
  } catch (e) {
    console.error('Ошибка синхронизации:', e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    showSync('📱 Сохранено локально', true);
  } finally {
    isSyncing = false;
    syncBtn.classList.remove('syncing');
  }
}

document.addEventListener('click', function() {
  if (audioContext && audioContext.state === 'suspended') audioContext.resume();
}, {once: true});

function init() {
  const savedSyncTime = localStorage.getItem('dix_vegas_last_sync');
  if (savedSyncTime) {
    lastSyncTime = new Date(savedSyncTime);
    const timeStr = lastSyncTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('syncTimeDisplay').textContent = `Последняя синхронизация: ${timeStr}`;
  }
  
  dataVersion = parseInt(localStorage.getItem('dix_vegas_data_version') || '0');
  
  const localData = localStorage.getItem(STORAGE_KEY);
  if (localData) {
    try { allData = JSON.parse(localData); } catch(e) {}
  }
  
  currentDateStr = getTodayString();
  if (!allData[currentDateStr]) {
    allData[currentDateStr] = createEmptyDayData();
    saveDataLocal();
  }
  
  renderCurrentDay();
  
  prevBtn.addEventListener('click', function() { playClickSound(); shiftDate(-1); });
  nextBtn.addEventListener('click', function() { playClickSound(); shiftDate(1); });
  dateInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') applyDateFromInput(); });
  dateInput.addEventListener('blur', function() { applyDateFromInput(); });
  searchBtn.addEventListener('click', function() { playClickSound(); applyDateFromInput(); });
  todayBtn.addEventListener('click', function() { playClickSound(); changeDate(getTodayString()); });
  syncBtn.addEventListener('click', syncNow);
  statsBtn.addEventListener('click', function() { playClickSound(); toggleStats(); });
  
  ti.addEventListener('input', function() {
    let v = ti.value.replace(',', '.');
    if (v === '') { return; }
    if (v.indexOf('.') !== -1) {
      const p = v.split('.');
      if (p[1] && p[1].length > 2) { p[1] = p[1].slice(0, 2); v = p.join('.'); ti.value = v; }
    }
    if (!/^-?\d*\.?\d*$/.test(v)) { ti.value = v.slice(0, -1); return; }
    if (!isNaN(parseFloat(v))) {
      setGlobalTotal(parseFloat(v));
      saveDataLocal();
      scheduleCloudSave();
    }
  });
  
  ti.addEventListener('blur', function() {
    const v = ti.value.replace(',', '.');
    if (v === '') { return; }
    const num = parseFloat(v);
    if (!isNaN(num)) {
      setGlobalTotal(num);
      saveDataLocal();
    }
  });
}

(async function initApp() {
  try {
    showSync('🔄 Загрузка данных...', false, true);
    
    try {
      await loadFromCloud();
      showSync('☁️ Данные загружены');
    } catch(e) {
      showSync('📱 Офлайн-режим', true);
    }
    
    init();
    
    setInterval(async () => {
      if (isSyncing) return;
      try { await syncNow(); } catch (e) {}
    }, 18000000);
  } catch(e) {
    console.error('Ошибка инициализации:', e);
    init();
  }
})();

window.addEventListener('beforeunload', () => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    if (lastSyncTime) {
      localStorage.setItem('dix_vegas_last_sync', lastSyncTime.toISOString());
    }
  } catch(e) {}
});

window.addEventListener('online', async () => {
  showSync('🌐 Онлайн — синхронизируем...', false, true);
  try { await syncNow(); } catch (e) {}
});

window.addEventListener('offline', () => {
  showSync('📱 Офлайн-режим', true);
});
</script>
