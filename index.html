<!DOCTYPE html>

<title>DIX | Vegas Counter</title>

<style>
:root {
  --nv-bg: #07091F;
  --nv-bg2: #10133A;
  --nv-pink: #FF2E88;
  --nv-pink-light: #FF5EAA;
  --nv-pink-glow: rgba(255, 46, 136, 0.55);
  --nv-cyan: #00F5FF;
  --nv-cyan-glow: rgba(0, 245, 255, 0.5);
  --nv-gold: #FFD166;
  --nv-gold-glow: rgba(255, 209, 102, 0.5);
  --nv-white: #F8F7FF;
  --nv-muted: #8D91B8;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html {
  width: 100%;
  min-height: 100%;
  background: var(--nv-bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  color-scheme: dark;
  height: 100%;
  overflow: hidden;
}

body, button, input {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-family: 'Orbitron', 'Press Start 2P', sans-serif;
}

button, input {
  -webkit-appearance: none;
  appearance: none;
}

body {
  font-family: 'Orbitron', 'Press Start 2P', sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  padding: 0.5rem; margin: 0; overflow: hidden;
  overscroll-behavior: none;
  position: relative;
  background:
    radial-gradient(circle at 20% 10%, rgba(255, 46, 136, 0.18), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(0, 245, 255, 0.15), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(255, 209, 102, 0.08), transparent 35%),
    linear-gradient(180deg, #07091F 0%, #10133A 50%, #050713 100%);
}

.app {
  width: 100%; max-width: 900px;
  height: 100%;
  max-height: 100%;
  background: linear-gradient(180deg, rgba(7, 9, 31, 0.97), rgba(16, 19, 58, 0.98));
  border: 3px solid var(--nv-pink);
  box-shadow: inset 0 0 0 2px rgba(255, 46, 136, 0.2), 0 0 30px var(--nv-pink-glow), 0 0 70px rgba(0, 245, 255, 0.08);
  padding: 0;
  display: flex; flex-direction: column; align-items: center;
  position: relative; z-index: 1; border-radius: 20px; overflow: hidden;
  margin: 0 auto;
}

.content-layer {
  position: relative; z-index: 2; width: 100%;
  height: 100%;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
}

/* --- шапка --- */
.hero-header {
  width: 100%;
  padding: 1.5rem 1rem 0.5rem;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(255, 46, 136, 0.25), transparent 45%),
    radial-gradient(ellipse at 70% 30%, rgba(0, 245, 255, 0.18), transparent 45%),
    linear-gradient(180deg, rgba(16, 19, 58, 0.95), rgba(7, 9, 31, 0.98));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  position: relative;
  z-index: 2;
  border-bottom: 3px solid var(--nv-pink);
  flex-shrink: 0;
  overflow: hidden;
}

.hero-header::before {
  content: 'DIX БОМДЖЕТ';
  position: absolute;
  top: 0.8rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1rem;
  color: var(--nv-pink);
  font-family: 'Press Start 2P', monospace;
  white-space: nowrap;
  opacity: 1;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 0 8px var(--nv-pink), 0 0 20px var(--nv-pink), 0 0 35px var(--nv-cyan);
  animation: neonPulse 2s infinite alternate ease-in-out;
}

@keyframes neonPulse {
  0% { text-shadow: 0 0 8px var(--nv-pink), 0 0 20px var(--nv-pink), 0 0 35px var(--nv-cyan); opacity: 0.9; }
  100% { text-shadow: 0 0 15px var(--nv-pink), 0 0 35px var(--nv-pink), 0 0 60px var(--nv-cyan), 0 0 80px var(--nv-pink); opacity: 1; }
}

@media (max-width: 480px) {
  .hero-header::before { font-size: 0.7rem; top: 0.9rem; gap: 5px; }
  .hero-header { padding: 2rem 0.5rem 0.5rem; }
  body { padding: 0; }
  .app { border-radius: 0; border-left: 2px solid var(--nv-pink); border-right: 2px solid var(--nv-pink); }
}

.hero-header .date-navigation,
.hero-header .date-actions,
.hero-header .mini-hud {
  position: relative; z-index: 1;
}

/* Попап статистики */
.stats-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(180deg, rgba(7,9,31,.98), rgba(16,19,58,.98));
  border: 3px solid var(--nv-pink);
  border-radius: 16px;
  padding: 20px 25px;
  z-index: 1000;
  display: none;
  flex-direction: column;
  gap: 15px;
  font-size: 0.75rem;
  color: var(--nv-white);
  white-space: nowrap;
  box-shadow: 0 0 30px var(--nv-pink-glow), 0 0 60px var(--nv-cyan-glow);
  backdrop-filter: blur(10px);
}

.stats-popup.show { display: flex; }

.stats-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 8px 0;
}

.stats-label {
  font-size: 0.8rem;
  letter-spacing: 1px;
  color: var(--nv-cyan);
  font-weight: 600;
  text-transform: uppercase;
}

.stats-value {
  color: var(--nv-gold);
  font-weight: 700;
  font-size: 1.2rem;
  text-shadow: 0 0 10px var(--nv-gold);
}

.date-navigation {
  margin-top: 0.2rem;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%;
}

.arrow-btn {
  width: 42px; height: 42px; border-radius: 8px;
  background: linear-gradient(180deg, var(--nv-pink), #6D1748);
  border: 2px solid var(--nv-pink);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 0 12px var(--nv-pink-glow);
  font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  text-shadow: 0 0 6px var(--nv-pink);
  flex-shrink: 0;
}
.arrow-btn:hover {
  background: linear-gradient(180deg, var(--nv-cyan), #123C55);
  border-color: var(--nv-cyan);
  box-shadow: 0 0 20px var(--nv-cyan-glow);
  transform: translateY(-1px);
}
.arrow-btn:active { transform: scale(0.9); }

.date-window-input {
  background: rgba(7, 9, 31, 0.9);
  border: 2px solid var(--nv-cyan);
  box-shadow: inset 0 0 12px rgba(0,245,255,.12), 0 0 12px rgba(0,245,255,.18);
  padding: 0.5rem 0.6rem; font-size: 0.7rem; font-weight: 400;
  color: var(--nv-white); min-width: 120px; width: 140px; height: 42px; text-align: center;
  letter-spacing: 2px; font-family: 'Press Start 2P', monospace;
  text-shadow: 0 0 8px var(--nv-cyan); border-radius: 8px;
  outline: none; transition: 0.2s;
}
.date-window-input:focus {
  border-color: var(--nv-gold);
  box-shadow: 0 0 18px var(--nv-gold-glow), inset 0 0 12px rgba(255,209,102,.12);
}
.date-window-input::placeholder { color: var(--nv-cyan); text-shadow:none; opacity:0.8; }

.date-window-input.today-highlight {
  border-color: var(--nv-gold);
  box-shadow: 0 0 25px var(--nv-gold-glow), 0 0 50px var(--nv-pink-glow), inset 0 0 15px rgba(0,245,255,.3);
  color: #fff;
  animation: todayPulse 2s infinite alternate;
}

@keyframes todayPulse {
  0% { box-shadow: 0 0 25px var(--nv-gold-glow), 0 0 50px var(--nv-pink-glow), inset 0 0 15px rgba(0,245,255,.3); }
  100% { box-shadow: 0 0 40px var(--nv-gold), 0 0 80px var(--nv-pink-glow), inset 0 0 20px rgba(0,245,255,.5); }
}

.date-actions {
  display: flex; align-items: center; justify-content: center; gap: 0.8rem;
  width: 100%;
  margin-top: 0.5rem;
}

.search-btn, .today-btn {
  padding: 0.6rem 1.2rem; border-radius: 8px;
  background: linear-gradient(180deg, var(--nv-pink), #68143F);
  border: 2px solid var(--nv-pink);
  box-shadow: 0 0 12px var(--nv-pink-glow);
  font-weight: 400; color: #fff; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease; white-space: nowrap;
  font-size: 0.7rem; font-family: 'Press Start 2P', monospace;
  text-shadow: 1px 1px 0px var(--nv-bg);
  flex: 1; max-width: 160px;
}
.search-btn:hover, .today-btn:hover {
  background: linear-gradient(180deg, var(--nv-cyan), #12404B);
  border-color: var(--nv-cyan);
  box-shadow: 0 0 20px var(--nv-cyan-glow);
  transform: translateY(-1px);
}
.search-btn:active, .today-btn:active { transform: scale(0.93); }
.today-btn { background: linear-gradient(180deg, var(--nv-cyan), #12404B); border-color: var(--nv-cyan); }

/* ==========================================
   NEON VEGAS — COMPACT HUD
   ========================================== */

.mini-hud {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin-top: 0.55rem;
  padding: 0.35rem 0.5rem 0.1rem;
  position: relative;
  z-index: 2;
}

.hud-item {
  min-height: 50px;
  height: 50px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.55rem;
  color: #F8F7FF;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button.hud-item { border: 2px solid; width: 50px; }

.hud-item:active { transform: scale(0.92); }

.hud-sync {
  padding: 0;
  background: rgba(0, 245, 255, 0.08);
  border-color: #00F5FF;
  color: #00F5FF;
  box-shadow: 0 0 8px rgba(0,245,255,.25);
}

.hud-sync:hover {
  background: rgba(0,245,255,.18);
  box-shadow: 0 0 16px rgba(0,245,255,.55);
}

/* HUD Money - input */
.hud-money {
  padding: 0;
  background: rgba(255,209,102,.08);
  border: 2px solid #FFD166;
  color: #FFD166;
  box-shadow: 0 0 10px rgba(255,209,102,.25);
  min-width: 150px;
  cursor: text;
  height: 50px;
}

.hud-money-input {
  background: transparent;
  border: none;
  outline: none;
  color: #FFD166;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.65rem;
  text-align: center;
  width: 100%;
  height: 100%;
  padding: 0 10px;
  text-shadow: 0 0 8px #FFD166;
}

.hud-money-input::placeholder {
  color: #FFD166;
  opacity: 0.5;
  font-size: 0.55rem;
}

.hud-stats {
  padding: 0;
  background: rgba(255,46,136,.08);
  border-color: #FF2E88;
  color: #FF2E88;
  box-shadow: 0 0 8px rgba(255,46,136,.25);
}

.hud-stats:hover {
  background: rgba(255,46,136,.18);
  box-shadow: 0 0 16px rgba(255,46,136,.55);
}

.hud-icon { font-size: 0.9rem; }
.hud-label { font-size: 0.5rem; }

@media (max-width: 480px) {
  .mini-hud { gap: 0.35rem; }
  .hud-item { min-height: 50px; height: 50px; }
  .hud-label { display: none; }
  .hud-money { min-width: 120px; }
  .hud-icon { font-size: 0.85rem; }
  .hud-money-input { font-size: 0.55rem; }
  button.hud-item { width: 50px; }
}

/* --- таблица --- */
.table-container {
  width: 100%; 
  flex: 1;
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(7,9,31,.92), rgba(10,13,42,.96));
  border-top: 2px solid var(--nv-pink);
  padding: 0.3rem;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
  position: relative;
  z-index: 1;
}
.data-table { width: 100%; border-collapse: collapse; }

.data-table tr {
  border-bottom: none;
  animation: rowIn 0.35s ease both;
  position: relative;
  transition: transform 0.15s ease, filter 0.15s ease;
}

.data-table tr:hover { transform: translateX(2px); }

.data-table td {
  padding: 0.3rem 0.2rem;
  vertical-align: middle;
  height: 48px;
}

.data-table td.row-number {
  width: 34px;
  padding-right: 0.2rem;
  font-size: 0.65rem;
  color: var(--nv-cyan);
  text-shadow: 0 0 7px var(--nv-cyan);
}

.data-table td.text-cell {
  padding-left: 0;
  padding-right: 0.25rem;
  width: 68%;
}

.data-table td.number-cell {
  padding-left: 0;
  width: 25%;
}

@keyframes rowIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

.row-number {
  font-weight: 400; color: var(--nv-cyan);
  text-align: center; font-family: 'Press Start 2P', monospace;
  text-shadow: 0 0 7px var(--nv-cyan);
}

.text-cell-input {
  width: 100%; height: 44px; padding: 0.4rem 0.5rem;
  border: 1px solid rgba(255,46,136,.35);
  background: linear-gradient(90deg, rgba(255,46,136,.07), rgba(7,9,31,.85));
  outline: none;
  color: var(--nv-white);
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem; font-weight: 600;
  text-align: left;
  box-shadow: inset 0 0 8px rgba(255,46,136,.05);
  border-radius: 8px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-sizing: border-box;
}
.text-cell-input:focus {
  border-color: var(--nv-pink);
  background: linear-gradient(90deg, rgba(255,46,136,.14), rgba(7,9,31,.9));
  box-shadow: 0 0 12px rgba(255,46,136,.35), inset 0 0 8px rgba(255,46,136,.08);
}
.text-cell-input::placeholder { color: var(--nv-muted); opacity: 0.5; }

.number-cell-input {
  width: 100%; height: 44px; padding: 0.4rem 0.5rem;
  border: 1px solid rgba(255,209,102,.45);
  background: linear-gradient(180deg, rgba(255,209,102,.08), rgba(7,9,31,.9));
  outline: none;
  color: var(--nv-gold);
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem; font-weight: 700;
  text-align: center;
  text-shadow: 0 0 8px var(--nv-gold);
  box-shadow: inset 0 0 6px rgba(255,209,102,.08);
  border-radius: 8px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
  box-sizing: border-box;
}
.number-cell-input:focus {
  border-color: var(--nv-cyan);
  box-shadow: 0 0 12px rgba(0,245,255,.45), inset 0 0 8px rgba(0,245,255,.08);
}

.data-table tr::after {
  content: '';
  position: absolute;
  left: 34px;
  right: 0;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,46,136,.35), rgba(0,245,255,.25), transparent);
  opacity: .6;
}

.data-table tr:focus-within {
  transform: scale(1.005);
  filter: drop-shadow(0 0 7px rgba(255,46,136,.25));
}

/* EXPENSE COLORS */
.number-cell-input.amount-low {
  color: #00E676;
  border-color: rgba(0,230,118,.55);
  text-shadow: 0 0 8px rgba(0,230,118,.8);
  box-shadow: 0 0 8px rgba(0,230,118,.18);
}

.number-cell-input.amount-medium {
  color: #FFD166;
  border-color: rgba(255,209,102,.6);
  text-shadow: 0 0 8px rgba(255,209,102,.8);
  box-shadow: 0 0 8px rgba(255,209,102,.2);
}

.number-cell-input.amount-high {
  color: #FF9F43;
  border-color: rgba(255,159,67,.65);
  text-shadow: 0 0 9px rgba(255,159,67,.85);
  box-shadow: 0 0 10px rgba(255,159,67,.25);
}

.number-cell-input.amount-danger {
  color: #FF3B6B;
  border-color: rgba(255,59,107,.7);
  text-shadow: 0 0 10px rgba(255,59,107,.9);
  box-shadow: 0 0 12px rgba(255,59,107,.3);
}

@keyframes bigExpense {
  0% { transform: scale(1); }
  35% { transform: scale(1.08); filter: drop-shadow(0 0 12px rgba(255,59,107,.9)); }
  100% { transform: scale(1); }
}

.number-cell-input.big-expense {
  animation: bigExpense 0.45s ease;
}

.table-container::-webkit-scrollbar { width: 10px; }
.table-container::-webkit-scrollbar-track { background: rgba(7,9,31,.8); border: 2px solid var(--nv-bg2); }
.table-container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--nv-pink), var(--nv-cyan), var(--nv-gold)); border: 2px solid rgba(255,255,255,.7); border-radius: 4px; }

.table-container.fade-swap { animation: fadeSwap 0.35s ease; }
@keyframes fadeSwap { 0% { opacity: 0.2; transform: translateX(6px); } 100% { opacity: 1; transform: translateX(0); } }

.sync-indicator {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--nv-cyan);
  color: var(--nv-bg);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.8rem;
  opacity: 0;
  transition: opacity 0.15s ease-out;
  z-index: 2000;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Orbitron', sans-serif;
  box-shadow: 0 0 20px var(--nv-cyan-glow);
}

.sync-indicator.show { opacity: 1; }
.sync-indicator.error { background: var(--nv-gold); }

.sync-indicator .sync-spinner {
  display: none;
  width: 12px;
  height: 12px;
  border: 2px solid rgba(7,9,31,.3);
  border-top: 2px solid var(--nv-bg);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.sync-indicator.syncing .sync-spinner { display: inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }

.last-sync-time {
  font-size: 0.6rem;
  color: var(--nv-muted);
  text-align: center;
  padding: 4px 8px;
  font-family: 'Orbitron', sans-serif;
  flex-shrink: 0;
}
</style>
</head>

let statsVisible = false;

const STORAGE_KEY = 'dix_vegas_data';
const GLOBAL_TOTAL_KEY = 'dix_vegas_global_total';
const TOTAL_ROWS = 50;

function getAudioContext() {
  if (!audioContext) {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      console.warn('Web Audio API не поддерживается');
      return null;
    }
  }
  return audioContext;
}

function playClickSound() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1200, ctx.currentTime + 0.02);
    osc2.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.08);
    gain2.gain.setValueAtTime(0.1, ctx.currentTime + 0.02);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc2.start(ctx.currentTime + 0.02);
    osc2.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

function playSyncSound() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(600, now);
    osc1.frequency.setValueAtTime(900, now + 0.04);
    osc1.frequency.setValueAtTime(1200, now + 0.08);
    gain1.gain.setValueAtTime(0.3, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc1.start(now);
    osc1.stop(now + 0.12);
  } catch(e) {}
}

function showSync(message, isError = false, isSyncingState = false) {
  const el = document.getElementById('syncStatus');
  const msgEl = document.getElementById('syncMessage');
  if (!el || !msgEl) return;
  msgEl.textContent = message;
  el.className = 'sync-indicator';
  if (isError) el.classList.add('error');
  if (isSyncingState) el.classList.add('syncing');
  el.classList.add('show');
  if (!isSyncingState) {
    setTimeout(() => {
      el.classList.remove('show');
      el.classList.remove('syncing');
    }, 2000);
  }
}

function updateLastSyncTime() {
  lastSyncTime = new Date();
  const timeStr = lastSyncTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const el = document.getElementById('syncTimeDisplay');
  if (el) el.textContent = `Последняя синхронизация: ${timeStr}`;
  localStorage.setItem('dix_vegas_last_sync', lastSyncTime.toISOString());
}

async function loadFromCloud() {
  try {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();
    const cloudData = result.record || {};
    const cloudVersion = cloudData._version || 0;
    const localVersion = parseInt(localStorage.getItem('dix_vegas_data_version') || '0');
    if (cloudVersion >= localVersion) {
      allData = cloudData;
      dataVersion = cloudVersion;
      localStorage.setItem('dix_vegas_data_version', cloudVersion.toString());
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    updateLastSyncTime();
    return allData;
  } catch (e) {
    console.warn('Ошибка загрузки из облака:', e.message);
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) {
      try { allData = JSON.parse(local); } catch(parseError) {}
    }
    return allData;
  }
}

async function saveToCloud() {
  if (!localChanges) return true;
  try {
    dataVersion++;
    allData._version = dataVersion;
    const dataToSave = JSON.parse(JSON.stringify(allData));
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(dataToSave)
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    localStorage.setItem('dix_vegas_data_version', dataVersion.toString());
    localChanges = false;
    updateLastSyncTime();
    showSync('☁️ Синхронизировано');
    return true;
  } catch (e) {
    console.error('Ошибка сохранения:', e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    showSync('📱 Офлайн — сохранено локально', true);
    throw e;
  }
}

function scheduleCloudSave() {
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    if (!localChanges || isSyncing) return;
    try { await saveToCloud(); } catch (e) {}
  }, 1500);
}

function formatDateToDisplay(d) {
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getFullYear()).slice(-2);
}

function formatDateToStorage(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDateFromInput(s) {
  s = s.trim();
  if (!s) return null;
  if (s.indexOf('.') !== -1) {
    const p = s.split('.');
    if (p.length === 3) {
      const d = parseInt(p[0]), m = parseInt(p[1]), y = parseInt(p[2]);
      if (!isNaN(d) && !isNaN(m) && !isNaN(y) && m >= 1 && m <= 12) {
        const year = y < 100 ? y + 2000 : y;
        const dt = new Date(year, m-1, d);
        if (dt.getFullYear() === year && dt.getMonth() === m-1 && dt.getDate() === d) return formatDateToStorage(dt);
      }
    }
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const ip = s.split('-').map(Number);
    const d2 = new Date(ip[0], ip[1]-1, ip[2]);
    if (d2.getFullYear() === ip[0] && d2.getMonth() === ip[1]-1 && d2.getDate() === ip[2]) return s;
  }
  return null;
}

function getTodayString() { return formatDateToStorage(new Date()); }
function storageToDisplay(s) { const p = s.split('-').map(Number); return formatDateToDisplay(new Date(p[0], p[1]-1, p[2])); }

function formatNumber(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '';
  if (n === Math.floor(n)) {
    return n.toString();
  }
  return n.toFixed(2);
}

function getGlobalTotal() {
  const val = localStorage.getItem(GLOBAL_TOTAL_KEY);
  return val ? parseFloat(val) : null;
}

function setGlobalTotal(val) {
  localStorage.setItem(GLOBAL_TOTAL_KEY, val.toString());
}

function getDayData(d) {
  if (!allData[d]) allData[d] = createEmptyDayData();
  return allData[d];
}

function createEmptyDayData() {
  const r = [];
  for (let i = 0; i < TOTAL_ROWS; i++) r.push({text:'', number:''});
  return {rows: r};
}

function getSpentSumForDate(dateStr) {
  if (!allData[dateStr]) return 0;
  const rows = allData[dateStr].rows || [];
  let sum = 0;
  for (let i = 0; i < TOTAL_ROWS; i++) {
    const val = rows[i] ? rows[i].number : '';
    if (val !== '' && val !== null && val !== undefined) {
      const n = parseFloat(val);
      if (!isNaN(n)) sum += n;
    }
  }
  return sum;
}

function getMonthlySpent(dateStr) {
  const parts = dateStr.split('-');
  const prefix = parts[0] + '-' + parts[1] + '-';
  let total = 0;
  for (const key in allData) {
    if (key.startsWith('_')) continue;
    if (key.indexOf(prefix) === 0) total += getSpentSumForDate(key);
  }
  return total;
}

function saveDataLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
  localChanges = true;
}

const dateInput = document.getElementById('currentDateInput');
const prevBtn = document.getElementById('prevDayBtn');
const nextBtn = document.getElementById('nextDayBtn');
const searchBtn = document.getElementById('searchDateBtn');
const todayBtn = document.getElementById('todayBtn');
const ti = document.getElementById('totalSumInput');
const tbody = document.getElementById('tableBody');
const tableContainer = document.getElementById('tableContainer');
const syncBtn = document.getElementById('syncBtn');
const statsBtn = document.getElementById('statsBtn');
const statsPopup = document.getElementById('statsPopup');

function applyDateFromInput() {
  const val = dateInput.value.trim();
  if (val === '') { changeDate(getTodayString()); return; }
  const parsed = parseDateFromInput(val);
  if (parsed) { changeDate(parsed); }
  else { alert('ВВЕДИТЕ ДАТУ 09.08.26'); dateInput.value = storageToDisplay(currentDateStr); }
}

function updateStats() {
  if (!currentDateStr) return;
  const todaySpent = getSpentSumForDate(currentDateStr);
  const monthSpent = getMonthlySpent(currentDateStr);
  
  document.getElementById('statToday').textContent = formatNumber(todaySpent);
  document.getElementById('statMonth').textContent = formatNumber(monthSpent);
}

function toggleStats() {
  statsVisible = !statsVisible;
  if (statsVisible) {
    statsPopup.classList.add('show');
    updateStats();
  } else {
    statsPopup.classList.remove('show');
  }
}

function updateAmountColor(el) {
  el.classList.remove('amount-low', 'amount-medium', 'amount-high', 'amount-danger');
  const value = parseFloat(el.value.replace(',', '.'));
  if (isNaN(value) || value < 0) return;
  if (value <= 10) el.classList.add('amount-low');
  else if (value <= 50) el.classList.add('amount-medium');
  else if (value <= 100) el.classList.add('amount-high');
  else el.classList.add('amount-danger');
}

function playBigExpenseAnimation(el) {
  el.classList.remove('big-expense');
  void el.offsetWidth;
  el.classList.add('big-expense');
  setTimeout(() => { el.classList.remove('big-expense'); }, 500);
}

function updateTotalDisplay() {
  const globalTotal = getGlobalTotal();
  if (globalTotal === null) {
    ti.value = '';
    ti.placeholder = 'СКОК ЧЕ';
  } else {
    ti.value = formatNumber(globalTotal);
  }
}

function renderCurrentDay() {
  if (!currentDateStr) return;
  const d = getDayData(currentDateStr);
  dateInput.value = storageToDisplay(currentDateStr);
  
  if (currentDateStr === getTodayString()) {
    dateInput.classList.add('today-highlight');
  } else {
    dateInput.classList.remove('today-highlight');
  }
  
  updateTotalDisplay();
  
  tbody.innerHTML = '';
  
  for (let i = 0; i < TOTAL_ROWS; i++) {
    const rd = d.rows[i] || {text:'', number:''};
    const tr = document.createElement('tr');
    tr.style.animationDelay = (i * 0.01) + 's';
    
    const tn = document.createElement('td');
    tn.className = 'row-number';
    tn.textContent = (i + 1) + '.';
    tr.appendChild(tn);
    
    const tt = document.createElement('td');
    tt.className = 'text-cell';
    const it = document.createElement('input');
    it.type = 'text';
    it.className = 'text-cell-input';
    it.placeholder = 'ну че опять тратим?';
    it.value = rd.text;
    it.addEventListener('input', (function(idx) { return function(e) {
      updateRowText(idx, e.target.value);
    }; })(i));
    tt.appendChild(it);
    tr.appendChild(tt);
    
    const tnum = document.createElement('td');
    tnum.className = 'number-cell';
    const inum = document.createElement('input');
    inum.type = 'text';
    inum.className = 'number-cell-input';
    inum.placeholder = '0';
    inum.value = rd.number;
    updateAmountColor(inum);
    inum.addEventListener('input', (function(idx) { return function(e) {
      handleNumberInput(idx, e.target);
    }; })(i));
    inum.addEventListener('blur', function(e) { formatNumberField(e.target); });
    tnum.appendChild(inum);
    tr.appendChild(tnum);
    
    tbody.appendChild(tr);
  }
  
  if (statsVisible) updateStats();
}

function updateRowText(i, v) {
  if (!currentDateStr) return;
  getDayData(currentDateStr).rows[i].text = v;
  saveDataLocal();
  scheduleCloudSave();
}

function handleNumberInput(i, el) {
  if (!currentDateStr) return;
  let v = el.value;
  if (v === '') {
    el.classList.remove('amount-low', 'amount-medium', 'amount-high', 'amount-danger');
    updateNumberInRow(i, '');
    return;
  }
  v = v.replace(',', '.');
  if (!/^-?\d*\.?\d*$/.test(v)) { el.value = v.slice(0, -1); return; }
  if (v.indexOf('.') !== -1) {
    const p = v.split('.');
    if (p[1] && p[1].length > 2) { p[1] = p[1].slice(0, 2); v = p.join('.'); el.value = v; }
  }
  updateNumberInRow(i, v);
  updateAmountColor(el);
  
  const numericValue = parseFloat(v.replace(',', '.'));
  if (!isNaN(numericValue) && numericValue >= 100) {
    playBigExpenseAnimation(el);
  }
}

function formatNumberField(el) {
  const v = el.value;
  if (v === '') return;
  const n = parseFloat(v.replace(',', '.'));
  el.value = !isNaN(n) ? formatNumber(v) : '';
  const tr = el.closest('tr');
  if (tr) {
    const i = Array.from(tr.parentNode.children).indexOf(tr);
    if (i >= 0 && i < TOTAL_ROWS) updateNumberInRow(i, el.value);
  }
}

function updateNumberInRow(i, v) {
  if (!currentDateStr) return;
  getDayData(currentDateStr).rows[i].number = v;
  saveDataLocal();
  updateTotalDisplay();
  if (statsVisible) updateStats();
  scheduleCloudSave();
}

function getSpentSum() { return getSpentSumForDate(currentDateStr); }

function playSwapAnim() {
  tableContainer.classList.remove('fade-swap');
  void tableContainer.offsetWidth;
  tableContainer.classList.add('fade-swap');
}

function changeDate(ns) {
  if (!ns || !/^\d{4}-\d{2}-\d{2}$/.test(ns)) return;
  currentDateStr = ns;
  renderCurrentDay();
  if (statsVisible) updateStats();
  playSwapAnim();
}

function shiftDate(days) {
  if (!currentDateStr) return;
  const p = currentDateStr.split('-').map(Number);
  const date = new Date(p[0], p[1] - 1, p[2]);
  date.setDate(date.getDate() + days);
  changeDate(formatDateToStorage(date));
}

async function syncNow() {
  if (isSyncing) return;
  isSyncing = true;
  syncBtn.classList.add('syncing');
  playSyncSound();
  showSync('🔄 Синхронизация...', false, true);
  
  try {
    if (localChanges) {
      await saveToCloud();
    }
    
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const result = await response.json();
    const cloudData = result.record || {};
    const cloudVersion = cloudData._version || 0;
    
    if (cloudVersion >= dataVersion) {
      allData = cloudData;
      dataVersion = cloudVersion;
      localStorage.setItem('dix_vegas_data_version', dataVersion.toString());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      localChanges = false;
      renderCurrentDay();
      showSync('☁️ Данные обновлены');
    } else {
      await saveToCloud();
      showSync('☁️ Локальные данные сохранены');
    }
    
    updateLastSyncTime();
  } catch (e) {
    console.error('Ошибка синхронизации:', e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    showSync('📱 Сохранено локально', true);
  } finally {
    isSyncing = false;
    syncBtn.classList.remove('syncing');
  }
}

document.addEventListener('click', function() {
  if (audioContext && audioContext.state === 'suspended') audioContext.resume();
}, {once: true});

function init() {
  const savedSyncTime = localStorage.getItem('dix_vegas_last_sync');
  if (savedSyncTime) {
    lastSyncTime = new Date(savedSyncTime);
    const timeStr = lastSyncTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('syncTimeDisplay').textContent = `Последняя синхронизация: ${timeStr}`;
  }
  
  dataVersion = parseInt(localStorage.getItem('dix_vegas_data_version') || '0');
  
  const localData = localStorage.getItem(STORAGE_KEY);
  if (localData) {
    try { allData = JSON.parse(localData); } catch(e) {}
  }
  
  currentDateStr = getTodayString();
  if (!allData[currentDateStr]) {
    allData[currentDateStr] = createEmptyDayData();
    saveDataLocal();
  }
  
  renderCurrentDay();
  
  prevBtn.addEventListener('click', function() { playClickSound(); shiftDate(-1); });
  nextBtn.addEventListener('click', function() { playClickSound(); shiftDate(1); });
  dateInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') applyDateFromInput(); });
  dateInput.addEventListener('blur', function() { applyDateFromInput(); });
  searchBtn.addEventListener('click', function() { playClickSound(); applyDateFromInput(); });
  todayBtn.addEventListener('click', function() { playClickSound(); changeDate(getTodayString()); });
  syncBtn.addEventListener('click', syncNow);
  statsBtn.addEventListener('click', function() { playClickSound(); toggleStats(); });
  
  ti.addEventListener('input', function() {
    let v = ti.value.replace(',', '.');
    if (v === '') { 
      localStorage.removeItem(GLOBAL_TOTAL_KEY);
      updateTotalDisplay();
      return; 
    }
    v = v.replace(/[^\d.]/g, '');
    if (v.indexOf('.') !== -1) {
      const p = v.split('.');
      if (p[1] && p[1].length > 2) { p[1] = p[1].slice(0, 2); v = p.join('.'); }
    }
    if (!/^\d*\.?\d*$/.test(v)) { ti.value = v.slice(0, -1); return; }
    if (!isNaN(parseFloat(v))) {
      setGlobalTotal(parseFloat(v));
      saveDataLocal();
      scheduleCloudSave();
    }
    ti.value = v;
  });
  
  ti.addEventListener('blur', function() {
    const v = ti.value.replace(',', '.');
    if (v === '') { 
      localStorage.removeItem(GLOBAL_TOTAL_KEY);
      updateTotalDisplay();
      return; 
    }
    v = v.replace(/[^\d.]/g, '');
    const num = parseFloat(v);
    if (!isNaN(num)) {
      setGlobalTotal(num);
      saveDataLocal();
    }
    updateTotalDisplay();
  });
}

(async function initApp() {
  try {
    showSync('🔄 Загрузка данных...', false, true);
    
    try {
      await loadFromCloud();
      showSync('☁️ Данные загружены');
    } catch(e) {
      showSync('📱 Офлайн-режим', true);
    }
    
    init();
    
    setInterval(async () => {
      if (isSyncing) return;
      try { await syncNow(); } catch (e) {}
    }, 18000000);
  } catch(e) {
    console.error('Ошибка инициализации:', e);
    init();
  }
})();

window.addEventListener('beforeunload', () => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    if (lastSyncTime) {
      localStorage.setItem('dix_vegas_last_sync', lastSyncTime.toISOString());
    }
  } catch(e) {}
});

window.addEventListener('online', async () => {
  showSync('🌐 Онлайн — синхронизируем...', false, true);
  try { await syncNow(); } catch (e) {}
});

window.addEventListener('offline', () => {
  showSync('📱 Офлайн-режим', true);
});
</script>
