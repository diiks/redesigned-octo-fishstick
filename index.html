<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIX | Подсчёт миллионов</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2d1b4e;
            background-image: 
                linear-gradient(45deg, #1a0a2e 25%, transparent 25%),
                linear-gradient(-45deg, #1a0a2e 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a0a2e 75%),
                linear-gradient(-45deg, transparent 75%, #1a0a2e 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
            image-rendering: pixelated;
        }

        .app {
            width: 100%;
            max-width: 800px;
            background: #1e1040;
            border: 6px solid #ff6b9d;
            box-shadow: 
                8px 8px 0px #c44d7a,
                8px 8px 0px 6px #ff6b9d;
            padding: 2rem 1.8rem 2.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
            image-rendering: auto;
        }

        .oval-header {
            width: 100%;
            max-width: 380px;
            background: #ffcc00;
            border: 5px solid #ff6b00;
            box-shadow: 6px 6px 0px #cc5500;
            border-radius: 50%;
            aspect-ratio: 1 / 0.55;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 0.3rem;
            padding: 0.2rem;
        }

        .brand-top {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #8b0000;
            text-shadow: 3px 3px 0px #ff4444;
            line-height: 1;
            font-family: 'Press Start 2P', monospace;
        }

        .brand-sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: #4a0000;
            letter-spacing: 2px;
            background: rgba(255, 255, 100, 0.8);
            padding: 0.2rem 1rem;
            border: 2px solid #cc4400;
            margin-top: 0.1rem;
            font-family: 'Press Start 2P', monospace;
        }

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .arrow-btn {
            width: 52px;
            height: 52px;
            border-radius: 0;
            background: #00dd88;
            border: 4px solid #00aa66;
            box-shadow: 4px 4px 0px #007744;
            font-size: 1.5rem;
            font-weight: bold;
            color: #003322;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            transition: all 0.05s ease;
            font-family: 'Press Start 2P', monospace;
        }

        .arrow-btn:hover {
            background: #00ff99;
            border-color: #00cc77;
        }

        .arrow-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #007744;
        }

        .date-window {
            background: #000033;
            border: 4px solid #4488ff;
            box-shadow: inset 0 0 10px #2244aa;
            padding: 0.7rem 1.8rem;
            font-size: 0.8rem;
            font-weight: 400;
            color: #00ff88;
            min-width: 180px;
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 0 6px #00ff88;
        }

        .search-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .date-search-input {
            flex: 2;
            min-width: 180px;
            padding: 0.6rem 1rem;
            border: 4px solid #aa66ff;
            background: #000033;
            font-size: 0.65rem;
            outline: none;
            text-align: center;
            font-weight: 400;
            color: #ffcc00;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 8px #5533aa;
        }

        .date-search-input:focus {
            border-color: #ff66cc;
            box-shadow: 0 0 0 3px rgba(255, 102, 204, 0.6), inset 0 0 8px #5533aa;
        }

        .date-search-input::placeholder {
            color: #5533aa;
        }

        .search-btn,
        .today-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 0;
            background: #ff66aa;
            border: 4px solid #cc4488;
            box-shadow: 4px 4px 0px #882266;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.05s ease;
            white-space: nowrap;
            font-size: 0.6rem;
            font-family: 'Press Start 2P', monospace;
        }

        .search-btn:hover,
        .today-btn:hover {
            background: #ff88bb;
        }

        .search-btn:active,
        .today-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #882266;
        }

        .today-btn {
            background: #ff8800;
            border-color: #cc6600;
            box-shadow: 4px 4px 0px #884400;
            color: #ffffff;
        }

        .today-btn:hover {
            background: #ffaa33;
        }

        .sums-container {
            width: 100%;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .sum-block {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            background: #2a1050;
            padding: 0.8rem 1rem;
            border: 4px solid #9966ff;
            box-shadow: 4px 4px 0px #6633aa;
        }

        .sum-label {
            font-weight: 400;
            color: #ffcc00;
            font-size: 0.6rem;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 2px 2px 0px #000000;
        }

        .sum-input {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 3px solid #6644cc;
            background: #000033;
            font-size: 0.7rem;
            font-weight: 400;
            text-align: center;
            outline: none;
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 6px #3322aa;
        }

        .sum-input:focus {
            border-color: #ff66cc;
            box-shadow: 0 0 0 3px rgba(255, 102, 204, 0.5), inset 0 0 6px #3322aa;
        }

        .sum-input[readonly] {
            background: #1a0a30;
            cursor: default;
            color: #ff8800;
        }

        .table-container {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            background: #1a0a30;
            border: 4px solid #9966ff;
            padding: 0.3rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            padding: 0.3rem;
        }

        .data-table tr {
            border-bottom: 3px solid #3a2060;
        }

        .data-table tr:last-child {
            border-bottom: none;
        }

        .data-table td {
            padding: 0.2rem 0.15rem;
            vertical-align: middle;
        }

        .row-number {
            font-weight: 400;
            color: #ffcc00;
            font-size: 0.6rem;
            text-align: center;
            width: 32px;
            white-space: nowrap;
            padding-right: 0 !important;
            padding-left: 0.2rem !important;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0px #000;
        }

        .emoji-cell {
            text-align: center;
            width: 48px;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .emoji-btn {
            background: #2a1050;
            border: 3px solid #5533aa;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0;
            opacity: 0.4;
            transition: all 0.1s ease;
            filter: grayscale(100%) brightness(0.7);
            line-height: 1;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            font-family: 'Press Start 2P', monospace;
        }

        .emoji-btn.active {
            opacity: 1;
            filter: grayscale(0%) brightness(1.3);
            border-color: #ff66cc;
            box-shadow: 0 0 10px currentColor, inset 0 0 6px currentColor;
            text-shadow: 0 0 8px currentColor;
        }

        .emoji-btn:hover {
            opacity: 0.7;
            filter: grayscale(40%) brightness(0.9);
            border-color: #9977dd;
        }

        .emoji-btn.active:hover {
            opacity: 1;
            filter: grayscale(0%) brightness(1.4);
        }

        .text-cell {
            padding-left: 0.1rem !important;
        }

        .text-cell input,
        .number-cell input {
            width: 100%;
            padding: 0.45rem 0.5rem;
            border: 3px solid #5533aa;
            background: #000033;
            font-size: 0.55rem;
            outline: none;
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 5px #3322aa;
        }

        .text-cell input {
            text-align: left;
        }

        .number-cell input {
            text-align: center;
            max-width: 90px;
            color: #ffcc00;
        }

        .text-cell input:focus,
        .number-cell input:focus {
            border-color: #ff66cc;
            box-shadow: 0 0 0 3px rgba(255, 102, 204, 0.5), inset 0 0 5px #3322aa;
        }

        .table-container::-webkit-scrollbar {
            width: 12px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #1a0a30;
            border: 2px solid #5533aa;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #ff66aa;
            border: 2px solid #cc4488;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="oval-header">
            <div class="brand-top">DIX</div>
            <div class="brand-sub">ПОДСЧЕТ МИЛЛИОНОВ</div>
        </div>

        <div class="date-navigation">
            <button class="arrow-btn" id="prevDayBtn" title="Предыдущий день">◄</button>
            <div class="date-window" id="currentDateDisplay"></div>
            <button class="arrow-btn" id="nextDayBtn" title="Следующий день">►</button>
        </div>

        <div class="search-row">
            <input type="text" id="searchDateInput" class="date-search-input" placeholder="09.08.26">
            <button class="search-btn" id="searchDateBtn">🔍 ПОИСК</button>
            <button class="today-btn" id="todayBtn">📅 СЕГОДНЯ</button>
        </div>

        <div class="sums-container">
            <div class="sum-block">
                <div class="sum-label">💰 ОБЩАЯ СУММА</div>
                <input type="text" id="totalSumInput" class="sum-input" placeholder="0">
            </div>
            <div class="sum-block">
                <div class="sum-label">💸 ПОТРАЧЕНО</div>
                <input type="text" id="spentSumInput" class="sum-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            var STORAGE_KEY = 'dix_million_data';
            var appData = {};
            var currentDateStr = '';
            var TOTAL_ROWS = 50;

            var emojis = [
                '🐍', '🦭', '🦔', '🐑', '🐥', '🐘', '🐪', '🦜', '🐬', '🦕',
                '🐝', '🪰', '🐡', '🐦‍🔥', '🦢', '🦘', '🦦', '🐦', '🐖', '🐈',
                '🐕', '🦧', '🐅', '🦓', '🐿️', '🐇', '🐼', '🐧', '🐊', '🐳',
                '🦋', '🪲', '🐌', '🪼', '🐙', '🦂', '🐞', '🦗', '🐠', '🦉',
                '🦎', '🐻', '🦏', '🦇', '🦚', '🐓', '🐮', '🐯', '🐷', '🦄'
            ];

            var glowColors = [
                '#ff4444', '#ff8800', '#ffdd00', '#44ff44', '#00ddff',
                '#4488ff', '#aa44ff', '#ff44aa', '#ff6699', '#66ff99',
                '#ff9966', '#99ff66', '#ff66cc', '#66ccff', '#ccff66',
                '#ff6666', '#66ffcc', '#cc66ff', '#ffcc66', '#66cc99',
                '#ff8888', '#88ff88', '#8888ff', '#ff88cc', '#88ccff',
                '#cc88ff', '#ffcc88', '#88ffcc', '#ccff88', '#ff88aa',
                '#aaff66', '#66aaff', '#ff66aa', '#aaffaa', '#ffaa66',
                '#66ffaa', '#aa66ff', '#ffaa88', '#88aaff', '#aaffcc',
                '#ccffaa', '#ffccaa', '#aaccff', '#ccffcc', '#ffaacc',
                '#ccaaff', '#ffccdd', '#ddffcc', '#ccddff', '#ddccff'
            ];

            var audioCtx = null;

            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // 8-bit звук активации — монетка
            function playActivateSound() {
                try {
                    var ctx = getAudioContext();
                    var now = ctx.currentTime;
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(987, now);
                    osc.frequency.setValueAtTime(1318, now + 0.04);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch (e) {}
            }

            // 8-bit звук деактивации — блоп
            function playDeactivateSound() {
                try {
                    var ctx = getAudioContext();
                    var now = ctx.currentTime;
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } catch (e) {}
            }

            function formatDateToDisplay(date) {
                var d = String(date.getDate()).padStart(2, '0');
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var y = String(date.getFullYear()).slice(-2);
                return d + '.' + m + '.' + y;
            }

            function formatDateToStorage(date) {
                var y = date.getFullYear();
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var d = String(date.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + d;
            }

            function parseDateFromInput(str) {
                str = str.trim();
                if (!str) return null;
                if (str.indexOf('.') !== -1) {
                    var dotParts = str.split('.');
                    if (dotParts.length === 3) {
                        var day = parseInt(dotParts[0], 10);
                        var month = parseInt(dotParts[1], 10);
                        var yearPart = parseInt(dotParts[2], 10);
                        if (!isNaN(day) && !isNaN(month) && !isNaN(yearPart) && month >= 1 && month <= 12) {
                            var year = yearPart;
                            if (yearPart < 100) year = 2000 + yearPart;
                            var date = new Date(year, month - 1, day);
                            if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                                return formatDateToStorage(date);
                            }
                        }
                    }
                }
                var regex = /^\d{4}-\d{2}-\d{2}$/;
                if (regex.test(str)) {
                    var isoParts = str.split('-').map(Number);
                    var date2 = new Date(isoParts[0], isoParts[1] - 1, isoParts[2]);
                    if (date2.getFullYear() === isoParts[0] && date2.getMonth() === isoParts[1] - 1 && date2.getDate() === isoParts[2]) {
                        return str;
                    }
                }
                return null;
            }

            function getTodayString() {
                return formatDateToStorage(new Date());
            }

            function loadData() {
                try {
                    var stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        appData = JSON.parse(stored);
                    } else {
                        appData = {};
                    }
                } catch (e) {
                    appData = {};
                }
                var today = getTodayString();
                if (!appData[today]) {
                    appData[today] = createEmptyDayData();
                }
            }

            function createEmptyDayData() {
                var rows = [];
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    rows.push({ text: '', number: '' });
                }
                return { total: '0', rows: rows };
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            }

            function getDayData(dateStr) {
                if (!appData[dateStr]) {
                    appData[dateStr] = createEmptyDayData();
                    saveData();
                }
                return appData[dateStr];
            }

            function storageToDisplay(dateStr) {
                var parts = dateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                return formatDateToDisplay(date);
            }

            function formatNumber(value) {
                var num = parseFloat(value);
                if (isNaN(num)) return '0';
                if (num === Math.floor(num)) {
                    return num.toString();
                } else {
                    return num.toFixed(2);
                }
            }

            var currentDateDisplay = document.getElementById('currentDateDisplay');
            var prevBtn = document.getElementById('prevDayBtn');
            var nextBtn = document.getElementById('nextDayBtn');
            var searchInput = document.getElementById('searchDateInput');
            var searchBtn = document.getElementById('searchDateBtn');
            var todayBtn = document.getElementById('todayBtn');
            var totalSumInput = document.getElementById('totalSumInput');
            var spentSumInput = document.getElementById('spentSumInput');
            var tableBody = document.getElementById('tableBody');

            function renderCurrentDay() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                var displayDate = storageToDisplay(currentDateStr);
                currentDateDisplay.textContent = displayDate;
                searchInput.value = displayDate;

                if (dayData.total === '0' || dayData.total === '' || parseFloat(dayData.total) === 0) {
                    totalSumInput.value = '';
                } else {
                    totalSumInput.value = dayData.total;
                }

                tableBody.innerHTML = '';
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var rowData = dayData.rows[i] || { text: '', number: '' };
                    var tr = document.createElement('tr');

                    var tdNum = document.createElement('td');
                    tdNum.className = 'row-number';
                    tdNum.textContent = (i + 1) + '.';
                    tr.appendChild(tdNum);

                    var tdEmoji = document.createElement('td');
                    tdEmoji.className = 'emoji-cell';
                    var emojiBtn = document.createElement('button');
                    emojiBtn.className = 'emoji-btn';
                    emojiBtn.textContent = emojis[i];
                    emojiBtn.setAttribute('data-row', i);
                    emojiBtn.addEventListener('click', function(e) {
                        var btn = e.currentTarget;
                        var isActive = btn.classList.contains('active');
                        if (isActive) {
                            btn.classList.remove('active');
                            btn.style.color = '';
                            playDeactivateSound();
                        } else {
                            btn.classList.add('active');
                            var colorIndex = parseInt(btn.getAttribute('data-row'));
                            btn.style.color = glowColors[colorIndex];
                            playActivateSound();
                        }
                    });
                    tdEmoji.appendChild(emojiBtn);
                    tr.appendChild(tdEmoji);

                    var tdText = document.createElement('td');
                    tdText.className = 'text-cell';
                    var inputText = document.createElement('input');
                    inputText.type = 'text';
                    inputText.placeholder = 'ОПИСАНИЕ';
                    inputText.value = rowData.text;
                    inputText.addEventListener('input', (function(index) {
                        return function(e) {
                            updateRowText(index, e.target.value);
                        };
                    })(i));
                    tdText.appendChild(inputText);
                    tr.appendChild(tdText);

                    var tdNumber = document.createElement('td');
                    tdNumber.className = 'number-cell';
                    var inputNumber = document.createElement('input');
                    inputNumber.type = 'text';
                    inputNumber.placeholder = '0';
                    inputNumber.value = rowData.number;
                    inputNumber.style.textAlign = 'center';
                    inputNumber.addEventListener('input', (function(index) {
                        return function(e) {
                            handleNumberInput(index, e.target);
                        };
                    })(i));
                    inputNumber.addEventListener('blur', function(e) {
                        formatNumberField(e.target);
                    });
                    tdNumber.appendChild(inputNumber);
                    tr.appendChild(tdNumber);

                    tableBody.appendChild(tr);
                }
                updateSumsDisplay();
            }

            function updateRowText(rowIndex, value) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) {
                    dayData.rows[rowIndex].text = value;
                }
                saveData();
            }

            function handleNumberInput(rowIndex, inputElement) {
                if (!currentDateStr) return;
                var val = inputElement.value;
                if (val === '') {
                    updateNumberInRow(rowIndex, '');
                    return;
                }
                val = val.replace(',', '.');
                if (!/^-?\d*\.?\d*$/.test(val)) {
                    inputElement.value = inputElement.value.slice(0, -1);
                    return;
                }
                if (val.indexOf('.') !== -1) {
                    var parts = val.split('.');
                    if (parts[1] && parts[1].length > 2) {
                        parts[1] = parts[1].slice(0, 2);
                        val = parts.join('.');
                        inputElement.value = val;
                    }
                }
                updateNumberInRow(rowIndex, val);
            }

            function formatNumberField(inputElement) {
                var val = inputElement.value;
                if (val === '') return;
                val = val.replace(',', '.');
                var num = parseFloat(val);
                if (!isNaN(num)) {
                    inputElement.value = formatNumber(val);
                } else {
                    inputElement.value = '';
                }
                var tr = inputElement.closest('tr');
                if (tr) {
                    var rowIndex = Array.from(tr.parentNode.children).indexOf(tr);
                    if (rowIndex >= 0 && rowIndex < TOTAL_ROWS) {
                        updateNumberInRow(rowIndex, inputElement.value);
                    }
                }
            }

            function updateNumberInRow(rowIndex, valueStr) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) {
                    dayData.rows[rowIndex].number = valueStr;
                }
                saveData();
                updateSumsDisplay();
            }

            function getSpentSum() {
                if (!currentDateStr) return 0;
                var dayData = getDayData(currentDateStr);
                var sum = 0;
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var numVal = dayData.rows[i] ? dayData.rows[i].number : '';
                    if (numVal !== '' && numVal !== null && numVal !== undefined) {
                        var n = parseFloat(numVal);
                        if (!isNaN(n)) sum += n;
                    }
                }
                return sum;
            }

            function updateSumsDisplay() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                var baseTotal = parseFloat(dayData.total) || 0;
                var spentSum = getSpentSum();
                var remaining = baseTotal - spentSum;

                if (spentSum === 0) {
                    spentSumInput.value = '';
                } else {
                    spentSumInput.value = formatNumber(spentSum);
                }

                if (remaining === 0 && baseTotal === 0) {
                    totalSumInput.value = '';
                } else if (remaining === 0 && baseTotal > 0) {
                    totalSumInput.value = '0';
                } else {
                    totalSumInput.value = formatNumber(remaining);
                }
            }

            function changeDate(newDateStr) {
                if (!newDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(newDateStr)) return;
                if (currentDateStr) {
                    var currentDayData = getDayData(currentDateStr);
                    var val = totalSumInput.value;
                    currentDayData.total = val === '' ? '0' : val;
                    saveData();
                }
                currentDateStr = newDateStr;
                renderCurrentDay();
            }

            function shiftDate(days) {
                if (!currentDateStr) return;
                var parts = currentDateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                date.setDate(date.getDate() + days);
                changeDate(formatDateToStorage(date));
            }

            document.addEventListener('click', function() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });

            function init() {
                loadData();
                var today = getTodayString();
                if (!appData[today]) {
                    appData[today] = createEmptyDayData();
                    saveData();
                }
                currentDateStr = today;
                renderCurrentDay();

                prevBtn.addEventListener('click', function() { shiftDate(-1); });
                nextBtn.addEventListener('click', function() { shiftDate(1); });

                searchBtn.addEventListener('click', function() {
                    var inputVal = searchInput.value.trim();
                    if (inputVal === '') {
                        changeDate(getTodayString());
                        return;
                    }
                    var parsed = parseDateFromInput(inputVal);
                    if (parsed) {
                        changeDate(parsed);
                    } else {
                        alert('ВВЕДИТЕ ДАТУ 09.08.26');
                        searchInput.value = storageToDisplay(currentDateStr);
                    }
                });

                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') searchBtn.click();
                });

                todayBtn.addEventListener('click', function() {
                    changeDate(getTodayString());
                });

                totalSumInput.addEventListener('input', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') {
                        getDayData(currentDateStr).total = '0';
                        saveData();
                        updateSumsDisplay();
                        return;
                    }
                    if (val.indexOf('.') !== -1) {
                        var parts = val.split('.');
                        if (parts[1] && parts[1].length > 2) {
                            parts[1] = parts[1].slice(0, 2);
                            val = parts.join('.');
                            totalSumInput.value = val;
                        }
                    }
                    if (!/^-?\d*\.?\d*$/.test(val)) {
                        totalSumInput.value = val.slice(0, -1);
                        return;
                    }
                    var num = parseFloat(val);
                    if (!isNaN(num)) {
                        getDayData(currentDateStr).total = val;
                        saveData();
                        updateSumsDisplay();
                    }
                });

                totalSumInput.addEventListener('blur', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') {
                        getDayData(currentDateStr).total = '0';
                        saveData();
                        updateSumsDisplay();
                        return;
                    }
                    var num = parseFloat(val);
                    if (isNaN(num)) {
                        getDayData(currentDateStr).total = '0';
                    } else {
                        getDayData(currentDateStr).total = formatNumber(val);
                    }
                    saveData();
                    updateSumsDisplay();
                });
            }

            init();
        })();
    </script>
</body>
</html>
