<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DIX | Vegas Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: linear-gradient(180deg, #1a0000 0%, #3d0000 30%, #660000 60%, #2a0000 100%);
  font-family: 'Orbitron', 'Press Start 2P', sans-serif;
  min-height: 100vh;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 0.5rem; margin: 0; overflow-x: hidden;
}

.app {
  width: 100%; max-width: 900px;
  background: linear-gradient(180deg, rgba(20,0,0,0.95) 0%, rgba(40,0,0,0.98) 100%);
  border: 3px solid #ffd700;
  box-shadow: inset 0 0 0 2px rgba(255,215,0,0.3),
              0 0 40px rgba(255,215,0,0.25),
              0 0 80px rgba(255,0,0,0.20);
  padding: 0;
  display: flex; flex-direction: column; align-items: center;
  position: relative; z-index: 1; border-radius: 20px; overflow: hidden;
}

.content-layer {
  position: relative; z-index: 2; width: 100%;
  display: flex; flex-direction: column; align-items: center;
}

/* --- шапка с неоновой вывеской --- */
.hero-header {
  width: 100%;
  padding: 2.5rem 1rem 0.7rem;
  background: linear-gradient(180deg, rgba(255,215,0,0.2) 0%, rgba(255,0,0,0.1) 50%, rgba(20,0,0,0.9) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  position: relative;
  z-index: 2;
  border-bottom: 3px solid #ffd700;
}

/* Обновленный псевдоэлемент с анимацией и эмодзи */
.hero-header::before {
  content: '🕹️ DIX COUNTER 🕹️';
  position: absolute;
  top: 0.7rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  color: #ffd700;
  font-family: 'Press Start 2P', monospace;
  white-space: nowrap;
  opacity: 0.8;
  z-index: 1;
  
  display: flex;
  align-items: center;
  gap: 6px;
  
  animation: neonGlow 2s infinite alternate ease-in-out;
}

@keyframes neonGlow {
  0% {
    text-shadow: 
      0 0 5px #ffd700, 
      0 0 10px #ff0000, 
      0 0 20px #ffd700;
    opacity: 0.7;
  }
  100% {
    text-shadow: 
      0 0 10px #ffd700, 
      0 0 25px #ff0000, 
      0 0 40px #ff0000,
      0 0 60px #ffd700;
    opacity: 1;
  }
}

@media (max-width: 480px) {
  .hero-header::before {
    font-size: 0.4rem;
    top: 0.8rem;
    gap: 4px;
  }
}

.hero-header .date-navigation,
.hero-header .date-actions {
  position: relative; z-index: 1;
}

.date-navigation {
  margin-top: 0.5rem;
}

/* --- навигация по датам --- */
.date-navigation {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%;
}

.arrow-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(180deg, #cc0000 0%, #660000 100%);
  border: 2px solid #ffd700;
  box-shadow: inset 0 2px 0 rgba(255,215,0,0.4), 0 4px 10px rgba(0,0,0,0.6), 0 0 12px rgba(255,215,0,0.3);
  font-size: 1rem; font-weight: bold; color: #ffd700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  text-shadow: 0 0 6px #ffd700;
}
.arrow-btn:hover {
  background: linear-gradient(180deg, #ff0000 0%, #990000 100%);
  box-shadow: inset 0 2px 0 rgba(255,215,0,0.5), 0 4px 14px rgba(0,0,0,0.6), 0 0 22px rgba(255,215,0,0.5);
  transform: translateY(-1px);
}
.arrow-btn:active { transform: scale(0.9); }

.date-window-input {
  background: rgba(0,0,0,0.8); border: 2px solid #ffd700;
  box-shadow: inset 0 0 14px rgba(255,215,0,0.3), 0 0 10px rgba(255,215,0,0.25);
  padding: 0.5rem 0.6rem; font-size: 0.7rem; font-weight: 400;
  color: #ffd700; min-width: 120px; width: 140px; text-align: center;
  letter-spacing: 2px; font-family: 'Press Start 2P', monospace;
  text-shadow: 0 0 8px #ffd700; border-radius: 8px;
  outline: none; transition: 0.2s;
}
.date-window-input:focus {
  border-color: #ffd700;
  box-shadow: 0 0 14px rgba(255,215,0,0.5), inset 0 0 10px rgba(255,215,0,0.3);
}
.date-window-input::placeholder { color: #660000; text-shadow:none; opacity:0.8; }

.date-actions {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%;
}

.search-btn, .today-btn {
  padding: 0.6rem 1.2rem; border-radius: 20px;
  background: linear-gradient(180deg, #cc0000 0%, #660000 100%);
  border: 2px solid #ffd700;
  box-shadow: inset 0 2px 0 rgba(255,215,0,0.4), 0 3px 8px rgba(0,0,0,0.6);
  font-weight: 400; color: #ffd700; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease; white-space: nowrap;
  font-size: 0.7rem; font-family: 'Press Start 2P', monospace;
  text-shadow: 1px 1px 0px #330000;
  flex: 1; max-width: 160px;
}
.search-btn:hover, .today-btn:hover {
  background: linear-gradient(180deg, #ff0000 0%, #990000 100%);
  box-shadow: inset 0 2px 0 rgba(255,215,0,0.5), 0 3px 12px rgba(0,0,0,0.6), 0 0 18px rgba(255,215,0,0.5);
  transform: translateY(-1px);
}
.search-btn:active, .today-btn:active { transform: scale(0.93); }
.today-btn { background: linear-gradient(180deg, #8b6914 0%, #4a3500 100%); border-color: #ffd700; }
.today-btn:hover { background: linear-gradient(180deg, #a8821a 0%, #6b4e00 100%); box-shadow: inset 0 2px 0 rgba(255,215,0,0.5), 0 3px 12px rgba(0,0,0,0.6), 0 0 18px rgba(255,215,0,0.5); }

/* --- блоки сумм --- */
.sums-container { 
  width: 100%; display: flex; gap: 0.5rem; 
  padding: 0.6rem 0.8rem;
  background: rgba(0,0,0,0.3);
}
.sum-block {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  align-items: center; gap: 0.3rem; background: rgba(30,0,0,0.7);
  padding: 0.5rem 0.6rem; border: 2px solid #ffd700;
  box-shadow: inset 0 0 14px rgba(255,215,0,0.2), 0 0 10px rgba(255,0,0,0.3);
  border-radius: 10px;
  backdrop-filter: blur(3px);
}
.sum-label {
  font-weight: 400; color: #ffd700; font-size: 0.42rem;
  text-align: center; font-family: 'Press Start 2P', monospace;
  text-shadow: 1px 1px 0px #330000, 0 0 10px #ffd700; line-height: 1.2;
}
.sum-input {
  width: 100%; padding: 0.4rem 0.4rem; border: 2px solid #8b6914;
  background: rgba(0,0,0,0.85); font-size: 0.55rem; text-align: center;
  outline: none; color: #ffd700; font-family: 'Press Start 2P', monospace;
  box-shadow: inset 0 0 8px rgba(255,215,0,0.2); border-radius: 8px;
}
.sum-input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.5), inset 0 0 8px rgba(255,215,0,0.2); }
.sum-input[readonly] { background: rgba(10,0,0,0.9); cursor: default; color: #ff4500; }

/* --- таблица --- */
.table-container {
  width: 100%; max-height: 500px; overflow-y: auto;
  background: rgba(0,0,0,0.6); border-top: 2px solid #ffd700;
  padding: 0.3rem;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table tr {
  border-bottom: 1px solid rgba(255,215,0,0.15);
  animation: rowIn 0.35s ease both;
}
@keyframes rowIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.data-table tr:last-child { border-bottom: none; }
.data-table td { padding: 0.15rem 0.1rem; vertical-align: middle; }
.data-table td.row-number { padding-right: 0.05rem; width: 24px; }
.data-table td.text-cell { padding-left: 0.1rem; padding-right: 0.2rem; }
.data-table td.number-cell { padding-left: 0.1rem; }

.row-number {
  font-weight: 400; color: #ffd700; font-size: 0.5rem;
  text-align: center; font-family: 'Press Start 2P', monospace;
  text-shadow: 0 0 6px #ffd700;
}

.text-cell { width: 72%; }
.number-cell { width: 22%; }

.text-cell textarea, .number-cell input {
  width: 100%; padding: 0.4rem 0.5rem; border: 2px solid #8b6914;
  background: rgba(0,0,0,0.85); outline: none;
  color: #ffd700; font-family: 'Press Start 2P', monospace;
  box-shadow: inset 0 0 6px rgba(255,215,0,0.2); border-radius: 8px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-sizing: border-box;
  height: 2.8em;
}
.text-cell textarea {
  resize: none; line-height: 1.3; font-size: 0.65rem;
  text-align: left; font-family: 'Orbitron', sans-serif;
}
.number-cell input {
  text-align: center; color: #ff4500;
  font-size: 0.9rem; font-weight: 700;
}
.text-cell textarea:focus, .number-cell input:focus {
  border-color: #ffd700;
  box-shadow: 0 0 8px rgba(255,215,0,0.4), inset 0 0 6px rgba(255,215,0,0.2);
}

.table-container::-webkit-scrollbar { width: 10px; }
.table-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.8); border: 2px solid #660000; }
.table-container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #cc0000, #660000); border: 2px solid #ffd700; border-radius: 4px; }

/* плавная смена дня */
.table-container.fade-swap, .sums-container.fade-swap { animation: fadeSwap 0.35s ease; }
@keyframes fadeSwap { 0% { opacity: 0.2; transform: translateX(6px); } 100% { opacity: 1; transform: translateX(0); } }
</style>
</head>

<body>
<div class="app">
  <div class="content-layer">

    <div class="hero-header">
      <div class="date-navigation">
        <button class="arrow-btn sfx-btn" id="prevDayBtn">◄</button>
        <input type="text" id="currentDateInput" class="date-window-input" placeholder="09.08.26">
        <button class="arrow-btn sfx-btn" id="nextDayBtn">►</button>
      </div>

      <div class="date-actions">
        <button class="search-btn sfx-btn" id="searchDateBtn">ПОИСК</button>
        <button class="today-btn sfx-btn" id="todayBtn">СЕГОДНЯ</button>
      </div>
    </div>

    <div class="sums-container" id="sumsContainer">
      <div class="sum-block">
        <div class="sum-label">💰 ОБЩАЯ СУММА</div>
        <input type="text" id="totalSumInput" class="sum-input" placeholder="0">
      </div>
      <div class="sum-block">
        <div class="sum-label">💸 ПОТРАЧЕНО</div>
        <input type="text" id="spentSumInput" class="sum-input" placeholder="0" readonly>
      </div>
      <div class="sum-block">
        <div class="sum-label">📆 ЗА МЕСЯЦ</div>
        <input type="text" id="monthlySpentInput" class="sum-input" placeholder="0" readonly>
      </div>
    </div>

    <div class="table-container" id="tableContainer">
      <table class="data-table"><tbody id="tableBody"></tbody></table>
    </div>

  </div>
</div>

<script>
  (function(){
  var STORAGE_KEY='dix_million_data',appData={},currentDateStr='',TOTAL_ROWS=50;

  var audioCtx=null;
  function getAudioContext(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }

  // Звук как в казино (монетки)
  function playClickSound(){
    try{ var ctx=getAudioContext(),now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sine'; osc.frequency.setValueAtTime(800,now); osc.frequency.exponentialRampToValueAtTime(600,now+0.06);
      gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now+0.08);
      var osc2=ctx.createOscillator(), gain2=ctx.createGain();
      osc2.type='sine'; osc2.frequency.setValueAtTime(1200,now+0.02); osc2.frequency.exponentialRampToValueAtTime(900,now+0.08);
      gain2.gain.setValueAtTime(0.1,now+0.02); gain2.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      osc2.connect(gain2); gain2.connect(ctx.destination); osc2.start(now+0.02); osc2.stop(now+0.1);
    }catch(e){}
  }

  function bindSfx(){
    document.querySelectorAll('.sfx-btn').forEach(function(btn){
      btn.addEventListener('click', playClickSound);
    });
  }

  function formatDateToDisplay(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(-2);}
  function formatDateToStorage(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function parseDateFromInput(s){
    s=s.trim(); if(!s) return null;
    if(s.indexOf('.')!==-1){
      var p=s.split('.');
      if(p.length===3){
        var d=parseInt(p[0]),m=parseInt(p[1]),y=parseInt(p[2]);
        if(!isNaN(d)&&!isNaN(m)&&!isNaN(y)&&m>=1&&m<=12){
          if(y<100) y+=2000;
          var dt=new Date(y,m-1,d);
          if(dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d) return formatDateToStorage(dt);
        }
      }
    }
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
      var ip=s.split('-').map(Number),d2=new Date(ip[0],ip[1]-1,ip[2]);
      if(d2.getFullYear()===ip[0]&&d2.getMonth()===ip[1]-1&&d2.getDate()===ip[2]) return s;
    }
    return null;
  }
  function getTodayString(){ return formatDateToStorage(new Date()); }
  function loadData(){
    try{ appData=JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; }catch(e){ appData={}; }
    if(!appData[getTodayString()]) appData[getTodayString()]=createEmptyDayData();
  }
  function createEmptyDayData(){ var r=[]; for(var i=0;i<TOTAL_ROWS;i++) r.push({text:'',number:''}); return {total:'0', rows:r}; }
  function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
  function getDayData(d){ if(!appData[d]){ appData[d]=createEmptyDayData(); saveData(); } return appData[d]; }
  function storageToDisplay(s){ var p=s.split('-').map(Number); return formatDateToDisplay(new Date(p[0],p[1]-1,p[2])); }
  function formatNumber(v){ var n=parseFloat(v); if(isNaN(n)) return '0'; return n===Math.floor(n)?n.toString():n.toFixed(2); }

  function getSpentSumForDate(dateStr){
    if(!appData[dateStr]) return 0;
    var rows=appData[dateStr].rows, sum=0;
    for(var i=0;i<TOTAL_ROWS;i++){
      var val=rows[i]?rows[i].number:'';
      if(val!==''&&val!==null&&val!==undefined){ var n=parseFloat(val); if(!isNaN(n)) sum+=n; }
    }
    return sum;
  }
  function getMonthlySpent(dateStr){
    var parts=dateStr.split('-'), prefix=parts[0]+'-'+parts[1]+'-', total=0;
    for(var key in appData){ if(key.indexOf(prefix)===0) total+=getSpentSumForDate(key); }
    return total;
  }

  var dateInput=document.getElementById('currentDateInput');
  var prevBtn=document.getElementById('prevDayBtn');
  var nextBtn=document.getElementById('nextDayBtn');
  var searchBtn=document.getElementById('searchDateBtn');
  var todayBtn=document.getElementById('todayBtn');
  var ti=document.getElementById('totalSumInput');
  var spi=document.getElementById('spentSumInput');
  var tbody=document.getElementById('tableBody');
  var monthlyInput=document.getElementById('monthlySpentInput');
  var tableContainer=document.getElementById('tableContainer');
  var sumsContainer=document.getElementById('sumsContainer');

  function applyDateFromInput(){
    var val=dateInput.value.trim();
    if(val===''){ changeDate(getTodayString()); return; }
    var parsed=parseDateFromInput(val);
    if(parsed){ changeDate(parsed); }
    else{ alert('ВВЕДИТЕ ДАТУ 09.08.26'); dateInput.value=storageToDisplay(currentDateStr); }
  }

  function renderCurrentDay(){
    if(!currentDateStr) return;
    var d=getDayData(currentDateStr);
    dateInput.value=storageToDisplay(currentDateStr);
    ti.value=(d.total==='0'||d.total===''||parseFloat(d.total)===0)?'':d.total;
    tbody.innerHTML='';

    for(var i=0;i<TOTAL_ROWS;i++){
      var rd=d.rows[i]||{text:'',number:''};
      var tr=document.createElement('tr');
      tr.style.animationDelay=(i*0.01)+'s';

      var tn=document.createElement('td');
      tn.className='row-number';
      tn.textContent=(i+1)+'.';
      tr.appendChild(tn);

      var tt=document.createElement('td');
      tt.className='text-cell';
      var it=document.createElement('textarea');
      it.rows=2;
      it.placeholder='ОПИСАНИЕ';
      it.value=rd.text;
      it.addEventListener('input', (function(idx){ return function(e){ updateRowText(idx, e.target.value); }; })(i));
      tt.appendChild(it);
      tr.appendChild(tt);

      var tnum=document.createElement('td');
      tnum.className='number-cell';
      var inum=document.createElement('input');
      inum.type='text';
      inum.placeholder='0';
      inum.value=rd.number;
      inum.addEventListener('input', (function(idx){ return function(e){ handleNumberInput(idx, e.target); }; })(i));
      inum.addEventListener('blur', function(e){ formatNumberField(e.target); });
      tnum.appendChild(inum);
      tr.appendChild(tnum);

      tbody.appendChild(tr);
    }
    updateSumsDisplay();
  }

  function updateRowText(i,v){ if(!currentDateStr) return; getDayData(currentDateStr).rows[i].text=v; saveData(); }

  function handleNumberInput(i, el){
    if(!currentDateStr) return;
    var v=el.value;
    if(v===''){ updateNumberInRow(i,''); return; }
    v=v.replace(',','.');
    if(!/^-?\d*\.?\d*$/.test(v)){ el.value=v.slice(0,-1); return; }
    if(v.indexOf('.')!==-1){
      var p=v.split('.');
      if(p[1] && p[1].length>2){ p[1]=p[1].slice(0,2); v=p.join('.'); el.value=v; }
    }
    updateNumberInRow(i,v);
  }

  function formatNumberField(el){
    var v=el.value;
    if(v==='') return;
    v=v.replace(',','.');
    var n=parseFloat(v);
    el.value=!isNaN(n) ? formatNumber(v) : '';
    var tr=el.closest('tr');
    if(tr){
      var i=Array.from(tr.parentNode.children).indexOf(tr);
      if(i>=0 && i<TOTAL_ROWS) updateNumberInRow(i, el.value);
    }
  }

  function updateNumberInRow(i,v){
    if(!currentDateStr) return;
    getDayData(currentDateStr).rows[i].number=v;
    saveData();
    updateSumsDisplay();
  }

  function getSpentSum(){ return getSpentSumForDate(currentDateStr); }

  function updateSumsDisplay(){
    if(!currentDateStr) return;
    var d=getDayData(currentDateStr), base=parseFloat(d.total)||0, spent=getSpentSum(), rem=base-spent;
    spi.value = spent===0 ? '' : formatNumber(spent);
    ti.value = (rem===0 && base===0) ? '' : (rem===0 && base>0 ? '0' : formatNumber(rem));
    var monthly=getMonthlySpent(currentDateStr);
    monthlyInput.value = monthly===0 ? '' : formatNumber(monthly);
  }

  function playSwapAnim(){
    tableContainer.classList.remove('fade-swap');
    sumsContainer.classList.remove('fade-swap');
    void tableContainer.offsetWidth;
    tableContainer.classList.add('fade-swap');
    sumsContainer.classList.add('fade-swap');
  }

  function changeDate(ns){
    if(!ns || !/^\d{4}-\d{2}-\d{2}$/.test(ns)) return;
    if(currentDateStr){
      var d=getDayData(currentDateStr);
      d.total = ti.value==='' ? '0' : ti.value;
      saveData();
    }
    currentDateStr=ns;
    renderCurrentDay();
    playSwapAnim();
  }

  function shiftDate(days){
    if(!currentDateStr) return;
    var p=currentDateStr.split('-').map(Number), date=new Date(p[0],p[1]-1,p[2]);
    date.setDate(date.getDate()+days);
    changeDate(formatDateToStorage(date));
  }

  document.addEventListener('click', function(){
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }, {once:true});

  function init(){
    loadData();
    currentDateStr=getTodayString();
    if(!appData[currentDateStr]){ appData[currentDateStr]=createEmptyDayData(); saveData(); }
    renderCurrentDay();

    prevBtn.addEventListener('click', function(){ shiftDate(-1); });
    nextBtn.addEventListener('click', function(){ shiftDate(1); });
    dateInput.addEventListener('keypress', function(e){ if(e.key==='Enter'){ applyDateFromInput(); } });
    dateInput.addEventListener('blur', function(){ applyDateFromInput(); });
    searchBtn.addEventListener('click', function(){ applyDateFromInput(); });
    todayBtn.addEventListener('click', function(){ changeDate(getTodayString()); });

    ti.addEventListener('input', function(){
      if(!currentDateStr) return;
      var v=ti.value.replace(',','.');
      if(v===''){ getDayData(currentDateStr).total='0'; saveData(); updateSumsDisplay(); return; }
      if(v.indexOf('.')!==-1){
        var p=v.split('.');
        if(p[1] && p[1].length>2){ p[1]=p[1].slice(0,2); v=p.join('.'); ti.value=v; }
      }
      if(!/^-?\d*\.?\d*$/.test(v)){ ti.value=v.slice(0,-1); return; }
      if(!isNaN(parseFloat(v))){ getDayData(currentDateStr).total=v; saveData(); updateSumsDisplay(); }
    });

    ti.addEventListener('blur', function(){
      if(!currentDateStr) return;
      var v=ti.value.replace(',','.');
      if(v===''){ getDayData(currentDateStr).total='0'; saveData(); updateSumsDisplay(); return; }
      getDayData(currentDateStr).total = isNaN(parseFloat(v)) ? '0' : formatNumber(v);
      saveData(); updateSumsDisplay();
    });

    bindSfx();
  }

  init();
  })();
</script>
</body>
</html>
