<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIX | Подсчёт миллионов</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ruslan+Display&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a0a00;
            font-family: 'Ruslan Display', 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Фон с динозаврами и кометой */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                /* Небо */
                linear-gradient(180deg, 
                    #0d1b2a 0%, 
                    #1b2838 15%, 
                    #2d1a0a 40%, 
                    #4a2a10 60%, 
                    #3d2008 80%, 
                    #1a0a00 100%
                ),
                /* Звёзды */
                radial-gradient(1px 1px at 10% 10%, #ffffff, transparent),
                radial-gradient(1px 1px at 25% 5%, #ffffff, transparent),
                radial-gradient(2px 2px at 40% 8%, #ffffff, transparent),
                radial-gradient(1px 1px at 55% 3%, #ffffff, transparent),
                radial-gradient(1px 1px at 70% 12%, #ffffff, transparent),
                radial-gradient(2px 2px at 85% 6%, #ffffff, transparent),
                radial-gradient(1px 1px at 15% 18%, #ffdd88, transparent),
                radial-gradient(1px 1px at 60% 15%, #ffdd88, transparent),
                radial-gradient(1px 1px at 80% 20%, #ffffff, transparent),
                radial-gradient(2px 2px at 33% 7%, #ffaa44, transparent),
                /* Луна */
                radial-gradient(60px 60px at 85% 12%, rgba(255,220,150,0.6) 0%, rgba(255,220,150,0.1) 40%, transparent 70%),
                /* Сияние луны */
                radial-gradient(120px 120px at 85% 12%, rgba(255,200,100,0.15) 0%, transparent 70%);
            z-index: 0;
        }

        /* Динозавры на фоне */
        .dino-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 80px;
            opacity: 0.2;
            filter: brightness(0.3) sepia(0.6);
        }

        .dino1 { bottom: 5%; left: 3%; font-size: 100px; transform: scaleX(-1); }
        .dino2 { bottom: 8%; right: 5%; font-size: 70px; }
        .dino3 { bottom: 3%; left: 40%; font-size: 55px; opacity: 0.15; }
        .dino4 { top: 5%; left: 8%; font-size: 45px; opacity: 0.12; transform: scaleX(-1); }
        .dino5 { top: 10%; right: 12%; font-size: 50px; opacity: 0.13; }

        /* Комета */
        .comet {
            position: fixed;
            top: -5%;
            right: 15%;
            font-size: 100px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
            filter: drop-shadow(0 0 20px #ff6600) drop-shadow(0 0 40px #ff4400);
            animation: cometMove 8s ease-in-out infinite;
        }

        @keyframes cometMove {
            0%, 100% { transform: translate(0, 0) rotate(-35deg); }
            50% { transform: translate(-30px, 20px) rotate(-33deg); }
        }

        /* Растения */
        .plants {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 0;
            font-size: 40px;
            opacity: 0.25;
            letter-spacing: 10px;
            color: #1a3a0a;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        .app {
            width: 100%;
            max-width: 800px;
            background: rgba(30, 15, 5, 0.85);
            border: 6px solid #5a3a1a;
            box-shadow: 
                inset 0 0 0 3px rgba(139, 90, 43, 0.4),
                0 0 30px rgba(255, 100, 0, 0.3),
                0 0 60px rgba(255, 60, 0, 0.15);
            padding: 1.8rem 1.8rem 2.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            position: relative;
            z-index: 1;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(139, 90, 43, 0.05) 20px, rgba(139, 90, 43, 0.05) 21px);
        }

        /* Следы лап */
        .app::before {
            content: '🐾';
            position: absolute;
            top: -25px;
            left: 20px;
            font-size: 30px;
            opacity: 0.4;
            transform: rotate(-15deg);
        }

        .app::after {
            content: '🐾';
            position: absolute;
            top: -25px;
            right: 25px;
            font-size: 30px;
            opacity: 0.4;
            transform: rotate(10deg);
        }

        .oval-header {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #5a3a1a 0%, #3d2008 50%, #2a1505 100%);
            border: 4px solid #8b5a2b;
            box-shadow: 
                inset 0 -4px 0 #2a1505,
                inset 0 4px 0 rgba(255, 200, 100, 0.3),
                0 0 20px rgba(255, 100, 0, 0.4);
            border-radius: 50%;
            aspect-ratio: 1 / 0.55;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 0.3rem;
            padding: 0.2rem;
            position: relative;
        }

        .brand-top {
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 8px;
            color: #ff8800;
            text-shadow: 
                0 0 10px #ff4400,
                0 0 20px #ff2200,
                2px 2px 0px #331100;
            line-height: 1;
            font-family: 'Ruslan Display', cursive;
        }

        .brand-sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: #ffcc66;
            letter-spacing: 4px;
            background: rgba(20, 8, 0, 0.6);
            padding: 0.2rem 1rem;
            border: 2px solid #8b5a2b;
            margin-top: 0.1rem;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0px #000;
        }

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .arrow-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(180deg, #8b6b3a 0%, #5a3a1a 100%);
            border: 3px solid #aa8b4a;
            box-shadow: 
                inset 0 2px 0 rgba(255, 200, 100, 0.4),
                0 4px 8px rgba(0,0,0,0.5),
                0 0 10px rgba(255, 100, 0, 0.2);
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffcc66;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            text-shadow: 0 0 5px #ff8800;
        }

        .arrow-btn:hover {
            background: linear-gradient(180deg, #aa8b4a 0%, #7a5a2a 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255, 220, 140, 0.5),
                0 4px 12px rgba(0,0,0,0.5),
                0 0 20px rgba(255, 150, 0, 0.4);
        }

        .arrow-btn:active {
            transform: scale(0.9);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
        }

        .date-window {
            background: rgba(15, 8, 0, 0.8);
            border: 3px solid #8b5a2b;
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.6),
                0 0 10px rgba(255, 100, 0, 0.2);
            padding: 0.7rem 1.8rem;
            font-size: 0.8rem;
            font-weight: 400;
            color: #ffaa44;
            min-width: 180px;
            text-align: center;
            letter-spacing: 2px;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 0 8px #ff6600;
            border-radius: 4px;
        }

        .search-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .date-search-input {
            flex: 2;
            min-width: 180px;
            padding: 0.6rem 1rem;
            border: 3px solid #5a3a1a;
            background: rgba(15, 8, 0, 0.8);
            font-size: 0.6rem;
            outline: none;
            text-align: center;
            color: #ffaa44;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .date-search-input:focus {
            border-color: #ff8800;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .date-search-input::placeholder {
            color: #5a3a1a;
        }

        .search-btn,
        .today-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            background: linear-gradient(180deg, #7a4a1a 0%, #4a2008 100%);
            border: 3px solid #aa6a2a;
            box-shadow: 
                inset 0 2px 0 rgba(255, 180, 80, 0.4),
                0 3px 6px rgba(0,0,0,0.5);
            font-weight: 400;
            color: #ffcc66;
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
            font-size: 0.55rem;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0px #331100;
        }

        .search-btn:hover,
        .today-btn:hover {
            background: linear-gradient(180deg, #9a5a2a 0%, #5a2a08 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255, 200, 100, 0.5),
                0 3px 8px rgba(0,0,0,0.5),
                0 0 15px rgba(255, 150, 0, 0.3);
        }

        .search-btn:active,
        .today-btn:active {
            transform: scale(0.93);
        }

        .today-btn {
            background: linear-gradient(180deg, #aa4a0a 0%, #6a2000 100%);
            border-color: #cc6600;
        }

        .sums-container {
            width: 100%;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .sum-block {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            background: rgba(20, 10, 0, 0.5);
            padding: 0.8rem 1rem;
            border: 3px solid #5a3a1a;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            border-radius: 6px;
        }

        .sum-label {
            font-weight: 400;
            color: #ffaa44;
            font-size: 0.55rem;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0px #000;
        }

        .sum-input {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 3px solid #4a2a0a;
            background: rgba(10, 5, 0, 0.8);
            font-size: 0.65rem;
            text-align: center;
            outline: none;
            color: #ffcc44;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        .sum-input:focus {
            border-color: #ff8800;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.4), inset 0 0 8px rgba(0,0,0,0.6);
        }

        .sum-input[readonly] {
            background: rgba(5, 2, 0, 0.9);
            cursor: default;
            color: #ff8800;
        }

        .table-container {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(15, 8, 0, 0.6);
            border: 3px solid #5a3a1a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            padding: 0.3rem;
            border-radius: 6px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            padding: 0.3rem;
        }

        .data-table tr {
            border-bottom: 2px solid rgba(139, 90, 43, 0.3);
        }

        .data-table tr:last-child {
            border-bottom: none;
        }

        .data-table td {
            padding: 0.2rem 0.15rem;
            vertical-align: middle;
        }

        .row-number {
            font-weight: 400;
            color: #ff8800;
            font-size: 0.55rem;
            text-align: center;
            width: 32px;
            white-space: nowrap;
            padding-right: 0 !important;
            padding-left: 0.2rem !important;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 0 6px #ff4400;
        }

        .emoji-cell {
            text-align: center;
            width: 48px;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .emoji-btn {
            background: rgba(30, 10, 0, 0.6);
            border: 2px solid #5a3a1a;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0;
            opacity: 0.35;
            transition: all 0.1s ease;
            filter: grayscale(70%) brightness(0.5);
            line-height: 1;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
        }

        .emoji-btn.active {
            opacity: 1;
            filter: grayscale(0%) brightness(1.5);
            border-color: #ff8800;
            box-shadow: 
                0 0 15px currentColor,
                inset 0 0 10px currentColor;
            text-shadow: 0 0 10px currentColor;
        }

        .emoji-btn:hover {
            opacity: 0.7;
            filter: grayscale(30%) brightness(0.8);
            border-color: #8b5a2b;
        }

        .emoji-btn.active:hover {
            opacity: 1;
            filter: grayscale(0%) brightness(1.6);
        }

        .text-cell {
            padding-left: 0.1rem !important;
        }

        .text-cell input,
        .number-cell input {
            width: 100%;
            padding: 0.45rem 0.5rem;
            border: 2px solid #5a3a1a;
            background: rgba(10, 5, 0, 0.8);
            font-size: 0.55rem;
            outline: none;
            color: #ffcc88;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .text-cell input {
            text-align: left;
        }

        .number-cell input {
            text-align: center;
            max-width: 90px;
            color: #ffaa44;
        }

        .text-cell input:focus,
        .number-cell input:focus {
            border-color: #ff8800;
            box-shadow: 0 0 8px rgba(255, 100, 0, 0.4), inset 0 0 6px rgba(0,0,0,0.5);
        }

        .table-container::-webkit-scrollbar {
            width: 14px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(15, 8, 0, 0.8);
            border: 2px solid #3d2008;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7a4a1a, #4a2008);
            border: 2px solid #5a3a1a;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Динозавры на фоне -->
    <div class="dino-bg dino1">🦕</div>
    <div class="dino-bg dino2">🦖</div>
    <div class="dino-bg dino3">🦕</div>
    <div class="dino-bg dino4">🦖</div>
    <div class="dino-bg dino5">🦕</div>
    
    <!-- Комета -->
    <div class="comet">☄️</div>
    
    <!-- Растения -->
    <div class="plants">🌿 🌴 🌿 🪴 🌿 🌴 🌿 🪴 🌿 🌴 🌿 🪴 🌿 🌴 🌿</div>

    <div class="app">
        <div class="oval-header">
            <div class="brand-top">DIX</div>
            <div class="brand-sub">ПОДСЧЕТ МИЛЛИОНОВ</div>
        </div>

        <div class="date-navigation">
            <button class="arrow-btn" id="prevDayBtn" title="Предыдущий день">◄</button>
            <div class="date-window" id="currentDateDisplay"></div>
            <button class="arrow-btn" id="nextDayBtn" title="Следующий день">►</button>
        </div>

        <div class="search-row">
            <input type="text" id="searchDateInput" class="date-search-input" placeholder="09.08.26">
            <button class="search-btn" id="searchDateBtn">🔍 ПОИСК</button>
            <button class="today-btn" id="todayBtn">📅 СЕГОДНЯ</button>
        </div>

        <div class="sums-container">
            <div class="sum-block">
                <div class="sum-label">💰 ОБЩАЯ СУММА</div>
                <input type="text" id="totalSumInput" class="sum-input" placeholder="0">
            </div>
            <div class="sum-block">
                <div class="sum-label">💸 ПОТРАЧЕНО</div>
                <input type="text" id="spentSumInput" class="sum-input" placeholder="0" readonly>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            var STORAGE_KEY = 'dix_million_data';
            var appData = {};
            var currentDateStr = '';
            var TOTAL_ROWS = 50;

            var emojis = [
                '🐍', '🦭', '🦔', '🐑', '🐥', '🐘', '🐪', '🦜', '🐬', '🦕',
                '🐝', '🪰', '🐡', '🐦‍🔥', '🦢', '🦘', '🦦', '🐦', '🐖', '🐈',
                '🐕', '🦧', '🐅', '🦓', '🐿️', '🐇', '🐼', '🐧', '🐊', '🐳',
                '🦋', '🪲', '🐌', '🪼', '🐙', '🦂', '🐞', '🦗', '🐠', '🦉',
                '🦎', '🐻', '🦏', '🦇', '🦚', '🐓', '🐮', '🐯', '🐷', '🦄'
            ];

            var glowColors = [
                '#ff4444', '#ff8800', '#ffdd00', '#44ff44', '#00ddff',
                '#4488ff', '#aa44ff', '#ff44aa', '#ff6699', '#66ff99',
                '#ff9966', '#99ff66', '#ff66cc', '#66ccff', '#ccff66',
                '#ff6666', '#66ffcc', '#cc66ff', '#ffcc66', '#66cc99',
                '#ff8888', '#88ff88', '#8888ff', '#ff88cc', '#88ccff',
                '#cc88ff', '#ffcc88', '#88ffcc', '#ccff88', '#ff88aa',
                '#aaff66', '#66aaff', '#ff66aa', '#aaffaa', '#ffaa66',
                '#66ffaa', '#aa66ff', '#ffaa88', '#88aaff', '#aaffcc',
                '#ccffaa', '#ffccaa', '#aaccff', '#ccffcc', '#ffaacc',
                '#ccaaff', '#ffccdd', '#ddffcc', '#ccddff', '#ddccff'
            ];

            var audioCtx = null;

            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // Звук — рёв динозавра (низкий рык)
            function playActivateSound() {
                try {
                    var ctx = getAudioContext();
                    var now = ctx.currentTime;
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(200, now + 0.04);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch (e) {}
            }

            // Звук — треск ветки
            function playDeactivateSound() {
                try {
                    var ctx = getAudioContext();
                    var now = ctx.currentTime;
                    var bufferSize = ctx.sampleRate * 0.06;
                    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    var data = buffer.getChannelData(0);
                    for (var i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.006));
                    }
                    var noise = ctx.createBufferSource();
                    var gain = ctx.createGain();
                    var filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 800;
                    noise.buffer = buffer;
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                    noise.stop(now + 0.06);
                } catch (e) {}
            }

            function formatDateToDisplay(date) {
                var d = String(date.getDate()).padStart(2, '0');
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var y = String(date.getFullYear()).slice(-2);
                return d + '.' + m + '.' + y;
            }

            function formatDateToStorage(date) {
                var y = date.getFullYear();
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var d = String(date.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + d;
            }

            function parseDateFromInput(str) {
                str = str.trim();
                if (!str) return null;
                if (str.indexOf('.') !== -1) {
                    var dotParts = str.split('.');
                    if (dotParts.length === 3) {
                        var day = parseInt(dotParts[0], 10);
                        var month = parseInt(dotParts[1], 10);
                        var yearPart = parseInt(dotParts[2], 10);
                        if (!isNaN(day) && !isNaN(month) && !isNaN(yearPart) && month >= 1 && month <= 12) {
                            var year = yearPart;
                            if (yearPart < 100) year = 2000 + yearPart;
                            var date = new Date(year, month - 1, day);
                            if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                                return formatDateToStorage(date);
                            }
                        }
                    }
                }
                var regex = /^\d{4}-\d{2}-\d{2}$/;
                if (regex.test(str)) {
                    var isoParts = str.split('-').map(Number);
                    var date2 = new Date(isoParts[0], isoParts[1] - 1, isoParts[2]);
                    if (date2.getFullYear() === isoParts[0] && date2.getMonth() === isoParts[1] - 1 && date2.getDate() === isoParts[2]) {
                        return str;
                    }
                }
                return null;
            }

            function getTodayString() {
                return formatDateToStorage(new Date());
            }

            function loadData() {
                try {
                    var stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        appData = JSON.parse(stored);
                    } else {
                        appData = {};
                    }
                } catch (e) {
                    appData = {};
                }
                var today = getTodayString();
                if (!appData[today]) {
                    appData[today] = createEmptyDayData();
                }
            }

            function createEmptyDayData() {
                var rows = [];
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    rows.push({ text: '', number: '' });
                }
                return { total: '0', rows: rows };
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            }

            function getDayData(dateStr) {
                if (!appData[dateStr]) {
                    appData[dateStr] = createEmptyDayData();
                    saveData();
                }
                return appData[dateStr];
            }

            function storageToDisplay(dateStr) {
                var parts = dateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                return formatDateToDisplay(date);
            }

            function formatNumber(value) {
                var num = parseFloat(value);
                if (isNaN(num)) return '0';
                if (num === Math.floor(num)) {
                    return num.toString();
                } else {
                    return num.toFixed(2);
                }
            }

            var currentDateDisplay = document.getElementById('currentDateDisplay');
            var prevBtn = document.getElementById('prevDayBtn');
            var nextBtn = document.getElementById('nextDayBtn');
            var searchInput = document.getElementById('searchDateInput');
            var searchBtn = document.getElementById('searchDateBtn');
            var todayBtn = document.getElementById('todayBtn');
            var totalSumInput = document.getElementById('totalSumInput');
            var spentSumInput = document.getElementById('spentSumInput');
            var tableBody = document.getElementById('tableBody');

            function renderCurrentDay() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                var displayDate = storageToDisplay(currentDateStr);
                currentDateDisplay.textContent = displayDate;
                searchInput.value = displayDate;

                if (dayData.total === '0' || dayData.total === '' || parseFloat(dayData.total) === 0) {
                    totalSumInput.value = '';
                } else {
                    totalSumInput.value = dayData.total;
                }

                tableBody.innerHTML = '';
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var rowData = dayData.rows[i] || { text: '', number: '' };
                    var tr = document.createElement('tr');

                    var tdNum = document.createElement('td');
                    tdNum.className = 'row-number';
                    tdNum.textContent = (i + 1) + '.';
                    tr.appendChild(tdNum);

                    var tdEmoji = document.createElement('td');
                    tdEmoji.className = 'emoji-cell';
                    var emojiBtn = document.createElement('button');
                    emojiBtn.className = 'emoji-btn';
                    emojiBtn.textContent = emojis[i];
                    emojiBtn.setAttribute('data-row', i);
                    emojiBtn.addEventListener('click', function(e) {
                        var btn = e.currentTarget;
                        var isActive = btn.classList.contains('active');
                        if (isActive) {
                            btn.classList.remove('active');
                            btn.style.color = '';
                            playDeactivateSound();
                        } else {
                            btn.classList.add('active');
                            var colorIndex = parseInt(btn.getAttribute('data-row'));
                            btn.style.color = glowColors[colorIndex];
                            playActivateSound();
                        }
                    });
                    tdEmoji.appendChild(emojiBtn);
                    tr.appendChild(tdEmoji);

                    var tdText = document.createElement('td');
                    tdText.className = 'text-cell';
                    var inputText = document.createElement('input');
                    inputText.type = 'text';
                    inputText.placeholder = 'ОПИСАНИЕ';
                    inputText.value = rowData.text;
                    inputText.addEventListener('input', (function(index) {
                        return function(e) {
                            updateRowText(index, e.target.value);
                        };
                    })(i));
                    tdText.appendChild(inputText);
                    tr.appendChild(tdText);

                    var tdNumber = document.createElement('td');
                    tdNumber.className = 'number-cell';
                    var inputNumber = document.createElement('input');
                    inputNumber.type = 'text';
                    inputNumber.placeholder = '0';
                    inputNumber.value = rowData.number;
                    inputNumber.style.textAlign = 'center';
                    inputNumber.addEventListener('input', (function(index) {
                        return function(e) {
                            handleNumberInput(index, e.target);
                        };
                    })(i));
                    inputNumber.addEventListener('blur', function(e) {
                        formatNumberField(e.target);
                    });
                    tdNumber.appendChild(inputNumber);
                    tr.appendChild(tdNumber);

                    tableBody.appendChild(tr);
                }
                updateSumsDisplay();
            }

            function updateRowText(rowIndex, value) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) dayData.rows[rowIndex].text = value;
                saveData();
            }

            function handleNumberInput(rowIndex, inputElement) {
                if (!currentDateStr) return;
                var val = inputElement.value;
                if (val === '') { updateNumberInRow(rowIndex, ''); return; }
                val = val.replace(',', '.');
                if (!/^-?\d*\.?\d*$/.test(val)) { inputElement.value = val.slice(0, -1); return; }
                if (val.indexOf('.') !== -1) {
                    var parts = val.split('.');
                    if (parts[1] && parts[1].length > 2) { parts[1] = parts[1].slice(0, 2); val = parts.join('.'); inputElement.value = val; }
                }
                updateNumberInRow(rowIndex, val);
            }

            function formatNumberField(inputElement) {
                var val = inputElement.value;
                if (val === '') return;
                val = val.replace(',', '.');
                var num = parseFloat(val);
                inputElement.value = !isNaN(num) ? formatNumber(val) : '';
                var tr = inputElement.closest('tr');
                if (tr) {
                    var rowIndex = Array.from(tr.parentNode.children).indexOf(tr);
                    if (rowIndex >= 0 && rowIndex < TOTAL_ROWS) updateNumberInRow(rowIndex, inputElement.value);
                }
            }

            function updateNumberInRow(rowIndex, valueStr) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) dayData.rows[rowIndex].number = valueStr;
                saveData();
                updateSumsDisplay();
            }

            function getSpentSum() {
                if (!currentDateStr) return 0;
                var dayData = getDayData(currentDateStr);
                var sum = 0;
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var numVal = dayData.rows[i] ? dayData.rows[i].number : '';
                    if (numVal !== '' && numVal !== null && numVal !== undefined) {
                        var n = parseFloat(numVal);
                        if (!isNaN(n)) sum += n;
                    }
                }
                return sum;
            }

            function updateSumsDisplay() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                var baseTotal = parseFloat(dayData.total) || 0;
                var spentSum = getSpentSum();
                var remaining = baseTotal - spentSum;
                spentSumInput.value = spentSum === 0 ? '' : formatNumber(spentSum);
                if (remaining === 0 && baseTotal === 0) totalSumInput.value = '';
                else if (remaining === 0 && baseTotal > 0) totalSumInput.value = '0';
                else totalSumInput.value = formatNumber(remaining);
            }

            function changeDate(newDateStr) {
                if (!newDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(newDateStr)) return;
                if (currentDateStr) {
                    var d = getDayData(currentDateStr);
                    d.total = totalSumInput.value === '' ? '0' : totalSumInput.value;
                    saveData();
                }
                currentDateStr = newDateStr;
                renderCurrentDay();
            }

            function shiftDate(days) {
                if (!currentDateStr) return;
                var parts = currentDateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                date.setDate(date.getDate() + days);
                changeDate(formatDateToStorage(date));
            }

            document.addEventListener('click', function() {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });

            function init() {
                loadData();
                var today = getTodayString();
                if (!appData[today]) { appData[today] = createEmptyDayData(); saveData(); }
                currentDateStr = today;
                renderCurrentDay();
                prevBtn.addEventListener('click', function() { shiftDate(-1); });
                nextBtn.addEventListener('click', function() { shiftDate(1); });
                searchBtn.addEventListener('click', function() {
                    var val = searchInput.value.trim();
                    if (val === '') { changeDate(getTodayString()); return; }
                    var parsed = parseDateFromInput(val);
                    if (parsed) changeDate(parsed);
                    else { alert('ВВЕДИТЕ ДАТУ 09.08.26'); searchInput.value = storageToDisplay(currentDateStr); }
                });
                searchInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') searchBtn.click(); });
                todayBtn.addEventListener('click', function() { changeDate(getTodayString()); });
                totalSumInput.addEventListener('input', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') { getDayData(currentDateStr).total = '0'; saveData(); updateSumsDisplay(); return; }
                    if (val.indexOf('.') !== -1) {
                        var parts = val.split('.');
                        if (parts[1] && parts[1].length > 2) { parts[1] = parts[1].slice(0, 2); val = parts.join('.'); totalSumInput.value = val; }
                    }
                    if (!/^-?\d*\.?\d*$/.test(val)) { totalSumInput.value = val.slice(0, -1); return; }
                    if (!isNaN(parseFloat(val))) { getDayData(currentDateStr).total = val; saveData(); updateSumsDisplay(); }
                });
                totalSumInput.addEventListener('blur', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') { getDayData(currentDateStr).total = '0'; saveData(); updateSumsDisplay(); return; }
                    var num = parseFloat(val);
                    getDayData(currentDateStr).total = isNaN(num) ? '0' : formatNumber(val);
                    saveData();
                    updateSumsDisplay();
                });
            }

            init();
        })();
    </script>
</body>
</html>
