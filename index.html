<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIX | Подсчёт миллионов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5fff0 0%, #e6ffd6 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }

        .app {
            width: 100%;
            max-width: 700px;
            background: #f9fff5;
            border-radius: 3.5rem;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 25px 45px rgba(80, 120, 60, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
            border: 1px solid rgba(180, 210, 140, 0.5);
        }

        .oval-header {
            width: 100%;
            max-width: 380px;
            background: #ccffcc;
            border: 3.5px solid #ff8c42;
            border-radius: 50%;
            aspect-ratio: 1 / 0.55;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 12px 18px rgba(255, 140, 0, 0.25);
            margin-bottom: 0.3rem;
            padding: 0.2rem;
        }

        .brand-top {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #1f7a1f;
            text-shadow: 2px 2px 0 rgba(255, 255, 200, 0.8);
            line-height: 1;
        }

        .brand-sub {
            font-size: 1.5rem;
            font-weight: 700;
            color: #228b22;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255, 255, 240, 0.7);
            padding: 0.1rem 1.2rem;
            border-radius: 2rem;
            margin-top: 0.1rem;
        }

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .arrow-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #e2f0d9;
            border: 2px solid #b6d7a8;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2d5a27;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            line-height: 1;
            user-select: none;
            transition: all 0.2s ease;
        }

        .arrow-btn:hover {
            background: #c8e6b5;
            border-color: #ff8c42;
            color: #1e3b1a;
            transform: scale(1.05);
        }

        .arrow-btn:active {
            transform: scale(0.94);
            background: #b1d89b;
        }

        .date-window {
            background: #fafff5;
            border: 2px solid #c5d5b0;
            border-radius: 2.5rem;
            padding: 0.7rem 1.8rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e4620;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            min-width: 170px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .search-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .date-search-input {
            flex: 2;
            min-width: 180px;
            padding: 0.7rem 1.2rem;
            border: 2px solid #c0cfaa;
            border-radius: 2.5rem;
            font-size: 1rem;
            background: white;
            outline: none;
            text-align: center;
            font-weight: 500;
            transition: 0.2s;
        }

        .date-search-input:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.25);
        }

        .search-btn,
        .today-btn {
            padding: 0.7rem 1.3rem;
            border-radius: 2.5rem;
            background: #dcedc8;
            border: 2px solid #aacf8e;
            font-weight: 600;
            color: #2d5423;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .search-btn:hover,
        .today-btn:hover {
            background: #c2e0a4;
            border-color: #ff8c42;
        }

        .today-btn {
            background: #ffe6d5;
            border-color: #ffb482;
            color: #5c3b1f;
        }

        .total-sum-block {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.86);
            padding: 0.5rem 1.5rem;
            border-radius: 3rem;
            border: 2px solid #bcd0a2;
        }

        .total-label {
            font-weight: 700;
            color: #2b532b;
            white-space: nowrap;
            font-size: 1.1rem;
        }

        .total-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 2px solid #d0e0bb;
            border-radius: 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            background: #f4fdef;
            outline: none;
            max-width: 200px;
        }

        .total-input:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.3);
        }

        .table-container {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 1.8rem;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #c8ddb0;
            padding: 0.2rem;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            padding: 0.3rem;
        }

        .data-table td {
            padding: 0.25rem 0.5rem;
        }

        .text-cell input,
        .number-cell input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: 2rem;
            border: 2px solid #d0e0bb;
            background: #fefffa;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .text-cell input {
            text-align: left;
        }

        .number-cell input {
            text-align: center;
            font-weight: 600;
            max-width: 100px;
        }

        .text-cell input:focus,
        .number-cell input:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 0 2px rgba(255, 140, 66, 0.3);
        }

        .text-cell {
            width: 70%;
        }

        .number-cell {
            width: 30%;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #b8cf9c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="oval-header">
            <div class="brand-top">DIX</div>
            <div class="brand-sub">ПОДСЧЕТ МИЛЛИОНОВ</div>
        </div>

        <div class="date-navigation">
            <button class="arrow-btn" id="prevDayBtn" title="Предыдущий день">←</button>
            <div class="date-window" id="currentDateDisplay"></div>
            <button class="arrow-btn" id="nextDayBtn" title="Следующий день">→</button>
        </div>

        <div class="search-row">
            <input type="text" id="searchDateInput" class="date-search-input" placeholder="09.08.26">
            <button class="search-btn" id="searchDateBtn">🔍 Поиск</button>
            <button class="today-btn" id="todayBtn">📅 Сегодня</button>
        </div>

        <div class="total-sum-block">
            <span class="total-label">💰 Общая сумма</span>
            <input type="number" id="totalSumInput" class="total-input" value="0" step="0.01" min="0" max="1000000">
        </div>

        <div class="table-container">
            <table class="data-table">
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            var STORAGE_KEY = 'dix_million_data';
            var appData = {};
            var currentDateStr = '';
            var TOTAL_ROWS = 100;

            function formatDateToDisplay(date) {
                var d = String(date.getDate()).padStart(2, '0');
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var y = String(date.getFullYear()).slice(-2);
                return d + '.' + m + '.' + y;
            }

            function formatDateToStorage(date) {
                var y = date.getFullYear();
                var m = String(date.getMonth() + 1).padStart(2, '0');
                var d = String(date.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + d;
            }

            function parseDateFromInput(str) {
                str = str.trim();
                if (!str) return null;

                if (str.indexOf('.') !== -1) {
                    var dotParts = str.split('.');
                    if (dotParts.length === 3) {
                        var day = parseInt(dotParts[0], 10);
                        var month = parseInt(dotParts[1], 10);
                        var yearPart = parseInt(dotParts[2], 10);
                        if (!isNaN(day) && !isNaN(month) && !isNaN(yearPart) && month >= 1 && month <= 12) {
                            var year = yearPart;
                            if (yearPart < 100) {
                                year = 2000 + yearPart;
                            }
                            var date = new Date(year, month - 1, day);
                            if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                                return formatDateToStorage(date);
                            }
                        }
                    }
                }

                var regex = /^\d{4}-\d{2}-\d{2}$/;
                if (regex.test(str)) {
                    var isoParts = str.split('-').map(Number);
                    var date2 = new Date(isoParts[0], isoParts[1] - 1, isoParts[2]);
                    if (date2.getFullYear() === isoParts[0] && date2.getMonth() === isoParts[1] - 1 && date2.getDate() === isoParts[2]) {
                        return str;
                    }
                }
                return null;
            }

            function getTodayString() {
                return formatDateToStorage(new Date());
            }

            function loadData() {
                try {
                    var stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        appData = JSON.parse(stored);
                    } else {
                        appData = {};
                    }
                } catch (e) {
                    appData = {};
                }
                var today = getTodayString();
                if (!appData[today]) {
                    appData[today] = createEmptyDayData();
                }
            }

            function createEmptyDayData() {
                var rows = [];
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    rows.push({ text: '', number: '' });
                }
                return { total: '0', rows: rows };
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            }

            function getDayData(dateStr) {
                if (!appData[dateStr]) {
                    appData[dateStr] = createEmptyDayData();
                    saveData();
                }
                return appData[dateStr];
            }

            function storageToDisplay(dateStr) {
                var parts = dateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                return formatDateToDisplay(date);
            }

            var currentDateDisplay = document.getElementById('currentDateDisplay');
            var prevBtn = document.getElementById('prevDayBtn');
            var nextBtn = document.getElementById('nextDayBtn');
            var searchInput = document.getElementById('searchDateInput');
            var searchBtn = document.getElementById('searchDateBtn');
            var todayBtn = document.getElementById('todayBtn');
            var totalSumInput = document.getElementById('totalSumInput');
            var tableBody = document.getElementById('tableBody');

            function renderCurrentDay() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                var displayDate = storageToDisplay(currentDateStr);
                currentDateDisplay.textContent = displayDate;
                searchInput.value = displayDate;
                totalSumInput.value = dayData.total;
                tableBody.innerHTML = '';
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var rowData = dayData.rows[i] || { text: '', number: '' };
                    var tr = document.createElement('tr');
                    var tdText = document.createElement('td');
                    tdText.className = 'text-cell';
                    var inputText = document.createElement('input');
                    inputText.type = 'text';
                    inputText.placeholder = 'Описание';
                    inputText.value = rowData.text;
                    inputText.addEventListener('input', (function(index) {
                        return function(e) {
                            updateRowText(index, e.target.value);
                        };
                    })(i));
                    tdText.appendChild(inputText);
                    var tdNumber = document.createElement('td');
                    tdNumber.className = 'number-cell';
                    var inputNumber = document.createElement('input');
                    inputNumber.type = 'number';
                    inputNumber.placeholder = '0';
                    inputNumber.value = rowData.number;
                    inputNumber.step = '0.01';
                    inputNumber.min = '0';
                    inputNumber.addEventListener('input', (function(index) {
                        return function(e) {
                            handleNumberInput(index, e.target);
                        };
                    })(i));
                    inputNumber.addEventListener('blur', function(e) {
                        formatNumberField(e.target);
                    });
                    tdNumber.appendChild(inputNumber);
                    tr.appendChild(tdText);
                    tr.appendChild(tdNumber);
                    tableBody.appendChild(tr);
                }
                // После отрисовки таблицы пересчитываем общую сумму
                recalcTotalFromRows();
            }

            function updateRowText(rowIndex, value) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) {
                    dayData.rows[rowIndex].text = value;
                }
                saveData();
            }

            function handleNumberInput(rowIndex, inputElement) {
                if (!currentDateStr) return;
                var val = inputElement.value;
                if (val === '') {
                    updateNumberInRow(rowIndex, '');
                    return;
                }
                val = val.replace(',', '.');
                if (!/^-?\d*\.?\d*$/.test(val)) {
                    inputElement.value = inputElement.value.slice(0, -1);
                    return;
                }
                if (val.indexOf('.') !== -1) {
                    var parts = val.split('.');
                    if (parts[1] && parts[1].length > 2) {
                        parts[1] = parts[1].slice(0, 2);
                        val = parts.join('.');
                        inputElement.value = val;
                    }
                }
                updateNumberInRow(rowIndex, val);
            }

            function formatNumberField(inputElement) {
                var val = inputElement.value;
                if (val === '') return;
                val = val.replace(',', '.');
                var num = parseFloat(val);
                if (!isNaN(num)) {
                    inputElement.value = num.toFixed(2);
                } else {
                    inputElement.value = '';
                }
                // После форматирования обновляем данные
                var rowIndex = Array.from(inputElement.closest('tr').parentNode.children).indexOf(inputElement.closest('tr'));
                if (rowIndex >= 0 && rowIndex < TOTAL_ROWS) {
                    updateNumberInRow(rowIndex, inputElement.value);
                }
            }

            function updateNumberInRow(rowIndex, valueStr) {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                if (dayData.rows[rowIndex]) {
                    dayData.rows[rowIndex].number = valueStr;
                }
                saveData();
                recalcTotalFromRows();
            }

            function recalcTotalFromRows() {
                if (!currentDateStr) return;
                var dayData = getDayData(currentDateStr);
                // Базовая сумма — это то, что пользователь ввёл в поле "Общая сумма"
                var baseTotal = parseFloat(dayData.total) || 0;
                
                // Суммируем все числа из таблицы
                var subtractSum = 0;
                for (var i = 0; i < TOTAL_ROWS; i++) {
                    var numVal = dayData.rows[i] ? dayData.rows[i].number : '';
                    if (numVal !== '' && numVal !== null && numVal !== undefined) {
                        var n = parseFloat(numVal);
                        if (!isNaN(n)) {
                            subtractSum += n;
                        }
                    }
                }
                
                // Итоговая сумма = базовая сумма - сумма чисел из таблицы
                var newTotal = baseTotal - subtractSum;
                // Показываем результат в поле (может быть отрицательным)
                totalSumInput.value = newTotal.toFixed(2);
            }

            function changeDate(newDateStr) {
                if (!newDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(newDateStr)) return;
                // Сохраняем текущую базовую сумму перед сменой даты
                if (currentDateStr) {
                    var currentDayData = getDayData(currentDateStr);
                    currentDayData.total = totalSumInput.value;
                    saveData();
                }
                currentDateStr = newDateStr;
                renderCurrentDay();
            }

            function shiftDate(days) {
                if (!currentDateStr) return;
                var parts = currentDateStr.split('-').map(Number);
                var date = new Date(parts[0], parts[1] - 1, parts[2]);
                date.setDate(date.getDate() + days);
                var newStr = formatDateToStorage(date);
                changeDate(newStr);
            }

            function init() {
                loadData();
                var today = getTodayString();
                if (!appData[today]) {
                    appData[today] = createEmptyDayData();
                    saveData();
                }
                currentDateStr = today;
                renderCurrentDay();

                prevBtn.addEventListener('click', function() { shiftDate(-1); });
                nextBtn.addEventListener('click', function() { shiftDate(1); });

                searchBtn.addEventListener('click', function() {
                    var inputVal = searchInput.value.trim();
                    if (inputVal === '') {
                        changeDate(getTodayString());
                        return;
                    }
                    var parsed = parseDateFromInput(inputVal);
                    if (parsed) {
                        changeDate(parsed);
                    } else {
                        alert('Введите корректную дату в формате 09.08.26');
                        searchInput.value = storageToDisplay(currentDateStr);
                    }
                });

                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        searchBtn.click();
                    }
                });

                todayBtn.addEventListener('click', function() {
                    changeDate(getTodayString());
                });

                // Когда пользователь меняет общую сумму вручную
                totalSumInput.addEventListener('input', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') val = '0';
                    if (val.indexOf('.') !== -1) {
                        var parts = val.split('.');
                        if (parts[1] && parts[1].length > 2) {
                            parts[1] = parts[1].slice(0, 2);
                            val = parts.join('.');
                            totalSumInput.value = val;
                        }
                    }
                    var num = parseFloat(val);
                    if (!isNaN(num)) {
                        var dayData = getDayData(currentDateStr);
                        dayData.total = val;
                        saveData();
                        // НЕ пересчитываем здесь, чтобы пользователь видел введённое число
                        // Пересчёт будет при вводе чисел в таблицу
                    }
                });

                totalSumInput.addEventListener('blur', function() {
                    if (!currentDateStr) return;
                    var val = totalSumInput.value.replace(',', '.');
                    if (val === '') val = '0';
                    var num = parseFloat(val);
                    if (isNaN(num)) {
                        totalSumInput.value = getDayData(currentDateStr).total;
                    } else {
                        totalSumInput.value = num.toFixed(2);
                        var dayData = getDayData(currentDateStr);
                        dayData.total = num.toFixed(2);
                        saveData();
                        recalcTotalFromRows();
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
